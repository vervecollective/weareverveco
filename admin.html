<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Site Admin — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#111111; --black-2:#171717;
    --orange:#D9531E; --orange-light:#E8703F;
    --cream:#F2EFE9; --muted:#ABABAB; --line: rgba(242,239,233,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',system-ui,sans-serif; background:var(--black); color:var(--cream); line-height:1.5;}
  .wrap{max-width:720px; margin:0 auto; padding:48px 32px 96px;}
  h1{font-size:26px; font-weight:800; margin-bottom:8px;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:36px;}
  .gate{max-width:360px; margin:120px auto; text-align:center;}
  .gate input{width:100%; padding:14px 16px; border:1px solid var(--line); border-radius:8px; background:var(--black-2); color:var(--cream); font-size:15px; margin-bottom:14px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--orange); color:#fff; border:none; border-radius:8px; padding:14px 24px;
    font-weight:700; font-size:14px; cursor:pointer; transition:background .15s;
  }
  .btn:hover{background:var(--orange-light);}
  .field{margin-bottom:22px;}
  label{display:block; font-size:12px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  textarea, input[type=text]{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--black-2); color:var(--cream); font-family:inherit; font-size:14.5px; line-height:1.5;
    resize:vertical;
  }
  textarea:focus, input:focus{outline:none; border-color:var(--orange);}
  .group-title{font-size:13px; font-weight:700; color:var(--orange); text-transform:uppercase; letter-spacing:0.05em; margin:36px 0 16px; padding-top:20px; border-top:1px solid var(--line);}
  .group-title:first-of-type{border-top:none; margin-top:0; padding-top:0;}
  .savebar{position:sticky; bottom:0; background:var(--black); padding:20px 0; border-top:1px solid var(--line); margin-top:20px;}
  .status{font-size:14px; margin-top:12px; display:none;}
  .status.show{display:block;}
  .status.ok{color:#7fd99a;}
  .status.err{color:#e08a8a;}
  #app{display:none;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Site Admin</h1>
  <p class="sub">Verve Collective — enter the admin password</p>
  <input type="password" id="pw" placeholder="Password" autofocus>
  <button class="btn" id="unlockBtn">Unlock</button>
  <p class="status err" id="gateError">Wrong password — try again.</p>
</div>

<div id="app">
  <div class="wrap">
    <h1>Edit site text</h1>
    <p class="sub">Changes go live on weareverveco.com as soon as you hit save.</p>
    <form id="cmsForm"></form>
  </div>
</div>

<script>
  var PASSWORD_KEY = 'vc_admin_pw';
  var FIELDS = [
    { group: 'Hero', key: 'hero_eyebrow', label: 'Eyebrow tag', type: 'input' },
    { group: 'Hero', key: 'hero_line1', label: 'Headline — line 1', type: 'input' },
    { group: 'Hero', key: 'hero_line2', label: 'Headline — line 2 (before accent word)', type: 'input' },
    { group: 'Hero', key: 'hero_accent', label: 'Headline — accent word', type: 'input' },
    { group: 'Hero', key: 'hero_sub', label: 'Subheading paragraph', type: 'textarea' },
    { group: 'Hero', key: 'honesty_text', label: 'Honesty box (HTML allowed, e.g. <strong>)', type: 'textarea' },

    { group: 'Services section', key: 'services_label', label: 'Eyebrow label', type: 'input' },
    { group: 'Services section', key: 'services_heading', label: 'Heading', type: 'input' },
    { group: 'Services section', key: 'services_sub', label: 'Subheading', type: 'textarea' },
    { group: 'Services section', key: 'pillar1_num', label: 'Card 1 — small label', type: 'input' },
    { group: 'Services section', key: 'pillar1_heading', label: 'Card 1 — heading', type: 'input' },
    { group: 'Services section', key: 'pillar1_desc', label: 'Card 1 — description', type: 'textarea' },
    { group: 'Services section', key: 'pillar2_num', label: 'Card 2 — small label', type: 'input' },
    { group: 'Services section', key: 'pillar2_heading', label: 'Card 2 — heading', type: 'input' },
    { group: 'Services section', key: 'pillar2_desc', label: 'Card 2 — description', type: 'textarea' },

    { group: 'Why Verve Collective', key: 'why_label', label: 'Eyebrow label', type: 'input' },
    { group: 'Why Verve Collective', key: 'why_heading', label: 'Heading', type: 'input' },
    { group: 'Why Verve Collective', key: 'why_sub', label: 'Subheading', type: 'textarea' },
    { group: 'Why Verve Collective', key: 'why1_heading', label: 'Item 1 — heading', type: 'input' },
    { group: 'Why Verve Collective', key: 'why1_desc', label: 'Item 1 — description', type: 'textarea' },
    { group: 'Why Verve Collective', key: 'why2_heading', label: 'Item 2 — heading', type: 'input' },
    { group: 'Why Verve Collective', key: 'why2_desc', label: 'Item 2 — description', type: 'textarea' },
    { group: 'Why Verve Collective', key: 'why3_heading', label: 'Item 3 — heading', type: 'input' },
    { group: 'Why Verve Collective', key: 'why3_desc', label: 'Item 3 — description', type: 'textarea' },

    { group: 'Process', key: 'process_label', label: 'Eyebrow label', type: 'input' },
    { group: 'Process', key: 'process_heading', label: 'Heading', type: 'input' },
    { group: 'Process', key: 'step1_heading', label: 'Step 1 — heading', type: 'input' },
    { group: 'Process', key: 'step1_desc', label: 'Step 1 — description', type: 'textarea' },
    { group: 'Process', key: 'step2_heading', label: 'Step 2 — heading', type: 'input' },
    { group: 'Process', key: 'step2_desc', label: 'Step 2 — description', type: 'textarea' },
    { group: 'Process', key: 'step3_heading', label: 'Step 3 — heading', type: 'input' },
    { group: 'Process', key: 'step3_desc', label: 'Step 3 — description', type: 'textarea' },
    { group: 'Process', key: 'step4_heading', label: 'Step 4 — heading', type: 'input' },
    { group: 'Process', key: 'step4_desc', label: 'Step 4 — description', type: 'textarea' },
    { group: 'Process', key: 'step5_heading', label: 'Step 5 — heading', type: 'input' },
    { group: 'Process', key: 'step5_desc', label: 'Step 5 — description', type: 'textarea' },

    { group: 'About', key: 'about_label', label: 'Eyebrow label', type: 'input' },
    { group: 'About', key: 'about_heading', label: 'Heading', type: 'input' },
    { group: 'About', key: 'about_p1', label: 'Paragraph 1', type: 'textarea' },
    { group: 'About', key: 'about_p2', label: 'Paragraph 2 (HTML allowed, e.g. <strong>)', type: 'textarea' },

    { group: 'Get started', key: 'book_label', label: 'Eyebrow label', type: 'input' },
    { group: 'Get started', key: 'book_heading', label: 'Heading', type: 'input' },
    { group: 'Get started', key: 'book_sub', label: 'Subheading', type: 'textarea' }
  ];

  var gate = document.getElementById('gate');
  var app = document.getElementById('app');
  var form = document.getElementById('cmsForm');
  var pwInput = document.getElementById('pw');

  function buildForm(values){
    values = values || {};
    var lastGroup = null;
    var html = '';
    FIELDS.forEach(function(f){
      if (f.group !== lastGroup){
        html += '<div class="group-title">' + f.group + '</div>';
        lastGroup = f.group;
      }
      var val = values[f.key] !== undefined ? values[f.key] : '';
      html += '<div class="field"><label for="' + f.key + '">' + f.label + '</label>';
      if (f.type === 'textarea'){
        html += '<textarea id="' + f.key + '" rows="3">' + escapeHtml(val) + '</textarea>';
      } else {
        html += '<input type="text" id="' + f.key + '" value="' + escapeHtml(val).replace(/"/g,'&quot;') + '">';
      }
      html += '</div>';
    });
    html += '<div class="savebar"><button type="submit" class="btn">Save changes</button>' +
            '<p class="status" id="saveStatus"></p></div>';
    form.innerHTML = html;
  }

  function escapeHtml(str){
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function loadContent(){
    fetch('/api/content')
      .then(function(r){ return r.json(); })
      .then(function(data){
        buildForm(data);
        gate.style.display = 'none';
        app.style.display = 'block';
      })
      .catch(function(){
        buildForm({});
        gate.style.display = 'none';
        app.style.display = 'block';
      });
  }

  document.getElementById('unlockBtn').addEventListener('click', function(){
    var pw = pwInput.value;
    if (!pw) return;
    sessionStorage.setItem(PASSWORD_KEY, pw);
    document.getElementById('gateError').classList.remove('show');
    loadContent();
  });

  pwInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter') document.getElementById('unlockBtn').click();
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var payload = {};
    FIELDS.forEach(function(f){
      var el = document.getElementById(f.key);
      if (el) payload[f.key] = el.value;
    });
    var status = document.getElementById('saveStatus');
    fetch('/api/content', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-password': sessionStorage.getItem(PASSWORD_KEY) || ''
      },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (res.status === 401){
        status.textContent = 'Wrong password — refresh this page and try again.';
        status.className = 'status show err';
        return;
      }
      status.textContent = 'Saved — live on the site now.';
      status.className = 'status show ok';
    }).catch(function(){
      status.textContent = 'Something went wrong. Try again.';
      status.className = 'status show err';
    });
  });
</script>

</body>
</html>
