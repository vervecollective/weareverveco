<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Board — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1160px;margin:0;padding:32px 36px 90px;}
  h1{font-size:22px;font-weight:700;letter-spacing:-.02em;}
  .lede{color:#6b7280;font-size:14px;margin-bottom:20px;}

  .bar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px;}
  .bar .f{flex:1;min-width:190px;}
  label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px;}
  input,select,textarea{width:100%;padding:9px 11px;font-size:13.5px;font-family:inherit;}

  /* board */
  .board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start;}
  @media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:620px){.board{grid-template-columns:1fr;}}

  .col{background:#f4f5f7;border-radius:12px;padding:10px;min-height:120px;transition:background .15s,box-shadow .15s;}
  .col.over{background:#fdf0eb;box-shadow:inset 0 0 0 2px #f0b79c;}
  .col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;}
  .col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .col-h b{font-size:12.5px;font-weight:700;letter-spacing:.02em;}
  .col-n{margin-left:auto;font-size:11.5px;font-weight:600;color:#6b7280;
    background:#fff;border-radius:20px;padding:1px 8px;}

  .t{background:#fff;border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:grab;
    box-shadow:0 1px 2px rgba(16,24,40,.06);border-left:3px solid transparent;
    transition:box-shadow .12s,transform .12s;}
  .t:hover{box-shadow:0 3px 10px rgba(16,24,40,.12);}
  .t:active{cursor:grabbing;}
  .t.drag{opacity:.4;transform:rotate(1.5deg);}
  .t.p-urgent{border-left-color:#b91c1c;}
  .t.p-high{border-left-color:#d97706;}
  .t.p-normal{border-left-color:#cbd5e1;}
  .t.p-low{border-left-color:#e5e7eb;}
  .t-title{font-size:13.5px;font-weight:600;line-height:1.4;margin-bottom:7px;}
  .t-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .av{width:22px;height:22px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;}
  .av.none{background:#e5e7eb;color:#9ca3af;}
  .due{font-size:11.5px;color:#6b7280;font-weight:500;}
  .due.late{color:#b91c1c;font-weight:600;}
  .due.soon{color:#b45309;font-weight:600;}
  .eye{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:#ecfdf5;color:#047857;}
  .blk{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:#fef2f2;color:#b91c1c;}
  .add{width:100%;background:none;border:1px dashed #cbd5e1;border-radius:9px;padding:9px;
    font-size:12.5px;font-weight:600;color:#6b7280;cursor:pointer;font-family:inherit;}
  .add:hover{border-color:#D9531E;color:#D9531E;background:#fff;}

  /* editor */
  .veil{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:1300;display:none;}
  .veil.on{display:block;}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:#fff;z-index:1310;
    transform:translateX(100%);transition:transform .22s cubic-bezier(.32,.72,0,1);
    overflow-y:auto;box-shadow:-2px 0 24px rgba(16,24,40,.16);}
  .sheet.on{transform:translateX(0);}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
    border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;}
  .sheet-h b{font-size:15px;font-weight:700;}
  .sheet-b{padding:20px;}
  .field{margin-bottom:14px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn{border:none;border-radius:6px;padding:9px 16px;font-size:13.5px;font-weight:600;
    cursor:pointer;font-family:inherit;background:#D9531E;color:#fff;}
  .btn-2{background:#fff;color:#111827;border:1px solid #d1d5db;}
  .btn-danger{background:#fff;color:#b91c1c;border:1px solid #fecaca;}
  .x{background:none;border:none;font-size:22px;line-height:1;color:#9ca3af;cursor:pointer;}
  .ck{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;}
  .ck input{width:auto;}
  .hintline{font-size:12px;color:#6b7280;margin-top:5px;}
  .msg{font-size:13px;margin-top:10px;display:none;}
  .msg.show{display:block;} .msg.ok{color:#047857;} .msg.err{color:#b91c1c;}
  /* comments */
  .cm-wrap{margin-top:22px;padding-top:18px;border-top:1px solid #e5e7eb;}
  .cm-wrap h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;margin-bottom:12px;}
  .cm{display:flex;gap:10px;margin-bottom:14px;}
  .cm .av{margin-top:1px;}
  .cm-b{flex:1;min-width:0;}
  .cm-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .cm-h b{font-size:12.5px;font-weight:600;}
  .cm-h em{font-size:11px;font-style:normal;color:#9ca3af;}
  .cm-t{font-size:13.5px;color:#374151;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
  .cm-t .mention{background:#fdf0eb;color:#9a3412;font-weight:600;border-radius:4px;padding:0 3px;}
  .cm.shared .cm-b{border-left:2px solid #047857;padding-left:9px;}
  .cm-tag{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;background:#ecfdf5;color:#047857;}
  .cm-box{position:relative;}
  .cm-box textarea{min-height:70px;}
  .cm-act{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .sugg{position:absolute;z-index:20;background:#fff;border:1px solid #e5e7eb;border-radius:8px;
    box-shadow:0 6px 20px rgba(16,24,40,.14);max-height:190px;overflow-y:auto;width:230px;display:none;}
  .sugg.on{display:block;}
  .sugg div{padding:9px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .sugg div:hover,.sugg div.sel{background:#fdf0eb;}
  .ro-t{font-size:17px;font-weight:700;line-height:1.35;margin-bottom:10px;}
  .ro-d{font-size:14px;color:#374151;white-space:pre-wrap;margin-bottom:18px;}
  .ro-d.none{color:#9ca3af;font-style:italic;}
  .ro-f{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:13.5px;}
  .ro-f span{color:#6b7280;} .ro-f b{font-weight:600;}
  .empty{color:#9ca3af;font-size:13px;text-align:center;padding:26px 10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Board</h1>
  <p class="lede">The work underneath the milestones. Internal unless you share it.</p>

  <div class="bar">
    <div class="f"><label for="eng">Engagement</label><select id="eng"></select></div>
    <div class="f"><label for="filt">Show</label>
      <select id="filt">
        <option value="all">Everything</option>
        <option value="mine">Assigned to me</option>
        <option value="unassigned">Unassigned</option>
        <option value="client">Client-visible</option>
      </select></div>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h"><b id="sheetTitle">Task</b>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn btn-2" id="editBtn" style="padding:6px 13px;font-size:12.5px">Edit</button>
      <button class="x" id="close">&times;</button>
    </div>
  </div>
  <div class="sheet-b" id="readView" style="display:none">
    <div id="roBody"></div>
  </div>
  <div class="sheet-b" id="editView">
    <div class="field"><label for="tTitle">Title</label><input type="text" id="tTitle"></div>
    <div class="field"><label for="tDetail">Detail</label><textarea id="tDetail" rows="3"></textarea></div>
    <div class="row">
      <div class="field"><label for="tStatus">Status</label>
        <select id="tStatus">
          <option value="todo">To do</option><option value="in_progress">In progress</option>
          <option value="blocked">Blocked</option><option value="review">Review</option>
          <option value="done">Done</option>
        </select></div>
      <div class="field"><label for="tPriority">Priority</label>
        <select id="tPriority">
          <option value="low">Low</option><option value="normal" selected>Normal</option>
          <option value="high">High</option><option value="urgent">Urgent</option>
        </select></div>
    </div>
    <div class="row">
      <div class="field"><label for="tAssignee">Assignee</label><select id="tAssignee"></select></div>
      <div class="field"><label for="tDue">Due</label><input type="date" id="tDue"></div>
    </div>
    <div class="field" id="blockWrap" style="display:none">
      <label for="tBlocked">What is blocking it</label>
      <input type="text" id="tBlocked" placeholder="Waiting on brand assets from the client">
    </div>
    <div class="field">
      <label class="ck"><input type="checkbox" id="tVisible"> Show this to the client</label>
      <p class="hintline">Off by default. Only tick it if the client should see this on their project page.</p>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      <button class="btn" id="save">Save</button>
      <button class="btn btn-2" id="cancel">Cancel</button>
      <button class="btn btn-danger" id="del" style="margin-left:auto">Delete</button>
    </div>
    <p class="msg" id="msg"></p>

    <div class="cm-wrap" id="cmWrap" style="display:none">
      <h3>Discussion</h3>
      <div id="cmList"></div>
      <div class="cm-box">
        <textarea id="cmText" placeholder="Add a note. Type @ to mention someone."></textarea>
        <div class="sugg" id="sugg"></div>
        <div class="cm-act">
          <button class="btn" id="cmSend">Comment</button>
          <label class="ck"><input type="checkbox" id="cmVisible"> Client can see this</label>
        </div>
        <p class="msg" id="cmMsg"></p>
      </div>
    </div>
  </div>
</div>

<script>
var COLS = [
  ['todo','To do','#94a3b8'],
  ['in_progress','In progress','#D9531E'],
  ['blocked','Blocked','#b91c1c'],
  ['review','Review','#7c3aed'],
  ['done','Done','#047857']
];
function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function ini(n){return (n||'?').split(' ').map(function(p){return p[0];}).filter(Boolean).join('').slice(0,2).toUpperCase();}
function say(t,ok){var m=$('msg');m.textContent=t;m.className='msg show '+(ok?'ok':'err');}

var sb, me, tasks=[], people=[], current=null, engId=null;

function dueClass(d, status){
  if (!d || status === 'done') return '';
  var today = new Date(); today.setHours(0,0,0,0);
  var due = new Date(d + 'T12:00:00');
  var days = Math.round((due - today) / 86400000);
  if (days < 0) return 'late';
  if (days <= 2) return 'soon';
  return '';
}
function dueText(d){
  if (!d) return '';
  var dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function render(){
  var f = $('filt').value;
  var shown = tasks.filter(function(t){
    if (f === 'mine') return t.assignee_id === me.id;
    if (f === 'unassigned') return !t.assignee_id;
    if (f === 'client') return t.client_visible;
    return true;
  });

  $('board').innerHTML = COLS.map(function(c){
    var inCol = shown.filter(function(t){ return t.status === c[0]; })
                     .sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); });
    return '<div class="col" data-s="'+c[0]+'">'+
      '<div class="col-h"><span class="col-dot" style="background:'+c[2]+'"></span>'+
        '<b>'+c[1]+'</b><span class="col-n">'+inCol.length+'</span></div>'+
      inCol.map(function(t){
        var who = people.filter(function(p){return p.id===t.assignee_id;})[0];
        var dc = dueClass(t.due_date, t.status);
        return '<div class="t p-'+t.priority+'" draggable="true" data-id="'+t.id+'">'+
          '<div class="t-title">'+esc(t.title)+'</div>'+
          '<div class="t-meta">'+
            (who ? '<span class="av" title="'+esc(who.full_name)+'">'+ini(who.full_name)+'</span>'
                 : '<span class="av none" title="Unassigned">?</span>')+
            (t.due_date ? '<span class="due '+dc+'">'+dueText(t.due_date)+'</span>' : '')+
            (t.client_visible ? '<span class="eye">Client</span>' : '')+
            (t.status==='blocked' && t.blocked_reason ? '<span class="blk" title="'+esc(t.blocked_reason)+'">Blocked</span>' : '')+
          '</div></div>';
      }).join('')+
      '<button class="add" data-add="'+c[0]+'">+ Add task</button>'+
    '</div>';
  }).join('');

  wire();
}

function wire(){
  document.querySelectorAll('.t').forEach(function(el){
    el.addEventListener('click', function(){ open(el.dataset.id); });
    el.addEventListener('dragstart', function(e){
      el.classList.add('drag');
      e.dataTransfer.setData('text/plain', el.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', function(){ el.classList.remove('drag'); });
  });

  document.querySelectorAll('.col').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', function(){ col.classList.remove('over'); });
    col.addEventListener('drop', async function(e){
      e.preventDefault(); col.classList.remove('over');
      var id = e.dataTransfer.getData('text/plain');
      var t = tasks.filter(function(x){return x.id===id;})[0];
      if (!t || t.status === col.dataset.s) return;
      var patch = { status: col.dataset.s };
      if (col.dataset.s === 'done') patch.completed_at = new Date().toISOString();
      t.status = col.dataset.s;  // optimistic — the board should not feel laggy
      render();
      var r = await sb.from('tasks').update(patch).eq('id', id);
      if (r.error) { say(r.error.message, false); load(); }
    });
  });

  document.querySelectorAll('[data-add]').forEach(function(b){
    b.addEventListener('click', function(){ open(null, b.dataset.add); });
  });
}

function open(id, status){
  current = id ? tasks.filter(function(t){return t.id===id;})[0] : null;
  $('sheetTitle').textContent = current ? 'Edit task' : 'New task';
  $('tTitle').value    = current ? current.title : '';
  $('tDetail').value   = current ? (current.detail||'') : '';
  $('tStatus').value   = current ? current.status : (status || 'todo');
  $('tPriority').value = current ? current.priority : 'normal';
  $('tAssignee').value = current ? (current.assignee_id||'') : '';
  $('tDue').value      = current ? (current.due_date||'') : '';
  $('tBlocked').value  = current ? (current.blocked_reason||'') : '';
  $('tVisible').checked = current ? !!current.client_visible : false;
  $('del').style.display = current ? '' : 'none';
  toggleBlocked();
  $('msg').className = 'msg';
  if (current) { readView(); mode(false); } else { mode(true); }
  loadComments(current ? current.id : null);
  $('cmText').value = ''; $('cmVisible').checked = false;
  $('veil').classList.add('on'); $('sheet').classList.add('on');
  setTimeout(function(){ $('tTitle').focus(); }, 180);
}
function readView(){
  if (!current) return;
  var who = people.filter(function(p){return p.id===current.assignee_id;})[0];
  var L = {todo:'To do',in_progress:'In progress',blocked:'Blocked',review:'Review',done:'Done'};
  var P = {low:'Low',normal:'Normal',high:'High',urgent:'Urgent'};
  $('roBody').innerHTML =
    '<div class="ro-t">'+esc(current.title)+'</div>'+
    '<div class="ro-d'+(current.detail?'':' none')+'">'+esc(current.detail||'No detail added.')+'</div>'+
    '<div class="ro-f"><span>Status</span><b>'+(L[current.status]||current.status)+'</b></div>'+
    '<div class="ro-f"><span>Priority</span><b>'+(P[current.priority]||current.priority)+'</b></div>'+
    '<div class="ro-f"><span>Assignee</span><b>'+esc(who?(who.full_name||who.email):'Unassigned')+'</b></div>'+
    '<div class="ro-f"><span>Due</span><b>'+(current.due_date?dueText(current.due_date):'\u2014')+'</b></div>'+
    (current.blocked_reason?'<div class="ro-f"><span>Blocked by</span><b>'+esc(current.blocked_reason)+'</b></div>':'')+
    '<div class="ro-f"><span>Client sees this</span><b>'+(current.client_visible?'Yes':'No')+'</b></div>';
}

function mode(edit){
  $('readView').style.display = edit ? 'none' : 'block';
  $('editView').style.display = edit ? 'block' : 'none';
  $('editBtn').style.display  = edit ? 'none' : '';
}

function shut(){ $('veil').classList.remove('on'); $('sheet').classList.remove('on'); current=null; }
function toggleBlocked(){ $('blockWrap').style.display = $('tStatus').value === 'blocked' ? '' : 'none'; }

var comments = [];

function when(ts){
  var d = new Date(ts), now = new Date();
  var mins = Math.round((now - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  if (mins < 1440) return Math.round(mins/60) + 'h ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

/* Names are highlighted on render rather than stored as markup, so a rename
   never leaves stale text behind in old comments. */
function markMentions(text){
  var out = esc(text);
  people.forEach(function(p){
    var n = (p.full_name || '').trim();
    if (!n) return;
    out = out.split('@' + esc(n)).join('<span class="mention">@' + esc(n) + '</span>');
    var first = n.split(' ')[0];
    if (first && first !== n) {
      out = out.split('@' + esc(first)).join('<span class="mention">@' + esc(first) + '</span>');
    }
  });
  return out;
}

async function loadComments(taskId){
  var wrap = $('cmWrap');
  if (!taskId) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';

  var r = await sb.from('comments').select('*').eq('task_id', taskId).order('created_at');
  comments = r.data || [];
  var list = $('cmList');

  if (!comments.length) {
    list.innerHTML = '<p style="font-size:13px;color:#9ca3af;margin-bottom:14px">' +
      'Nothing yet. Notes here stay with the task \u2014 whoever picks it up later sees why.</p>';
    return;
  }

  list.innerHTML = comments.map(function(c){
    var a = people.filter(function(p){return p.id===c.author_id;})[0];
    var nm = a ? (a.full_name || a.email) : 'Someone';
    return '<div class="cm'+(c.client_visible?' shared':'')+'">'+
      '<span class="av">'+ini(nm)+'</span>'+
      '<div class="cm-b"><div class="cm-h"><b>'+esc(nm)+'</b><em>'+when(c.created_at)+'</em>'+
        (c.client_visible?'<span class="cm-tag">Client</span>':'')+'</div>'+
      '<div class="cm-t">'+markMentions(c.body)+'</div></div></div>';
  }).join('');
}

/* @mention autocomplete */
(function(){
  var box, sugg, matches = [], sel = 0, at = -1;

  function hide(){ if (sugg) { sugg.classList.remove('on'); } matches = []; at = -1; }

  function show(){
    if (!matches.length) return hide();
    sugg.innerHTML = matches.map(function(p,i){
      return '<div class="'+(i===sel?'sel':'')+'" data-i="'+i+'">'+
        '<span class="av">'+ini(p.full_name||p.email)+'</span>'+esc(p.full_name||p.email)+'</div>';
    }).join('');
    sugg.classList.add('on');
    sugg.querySelectorAll('div').forEach(function(d){
      d.addEventListener('mousedown', function(e){ e.preventDefault(); pick(Number(d.dataset.i)); });
    });
  }

  function pick(i){
    var p = matches[i]; if (!p) return;
    var v = box.value, name = p.full_name || p.email;
    box.value = v.slice(0, at) + '@' + name + ' ' + v.slice(box.selectionStart);
    hide(); box.focus();
  }

  window.initMentions = function(){
    box = $('cmText'); sugg = $('sugg');
    box.addEventListener('input', function(){
      var pos = box.selectionStart, v = box.value;
      var i = v.lastIndexOf('@', pos - 1);
      if (i === -1 || (i > 0 && /\S/.test(v[i-1]))) return hide();
      var q = v.slice(i + 1, pos).toLowerCase();
      if (q.length > 24 || q.indexOf(' ') > -1 && q.trim().split(' ').length > 2) return hide();
      at = i; sel = 0;
      matches = people.filter(function(p){
        return (p.full_name || p.email || '').toLowerCase().indexOf(q) > -1;
      }).slice(0, 6);
      show();
    });
    box.addEventListener('keydown', function(e){
      if (!matches.length) return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); sel=(sel+1)%matches.length; show(); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); sel=(sel-1+matches.length)%matches.length; show(); }
      else if (e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); pick(sel); }
      else if (e.key === 'Escape'){ hide(); }
    });
    box.addEventListener('blur', function(){ setTimeout(hide, 120); });
  };
})();

function mentionedIds(text){
  var ids = [];
  people.forEach(function(p){
    var n = (p.full_name || '').trim();
    if (!n) return;
    var first = n.split(' ')[0];
    if (text.indexOf('@' + n) > -1 || (first && text.indexOf('@' + first) > -1)) ids.push(p.id);
  });
  return ids.filter(function(v,i,a){ return a.indexOf(v) === i && v !== me.id; });
}

async function load(){
  if (!engId) { $('board').innerHTML = '<div class="empty">Pick an engagement.</div>'; return; }
  var r = await sb.from('tasks').select('*').eq('engagement_id', engId).order('sort_order');
  if (r.error) { $('board').innerHTML = '<div class="empty">'+esc(r.error.message)+'</div>'; return; }
  tasks = r.data || [];
  render();
}

window.vcInit = async function(){
  sb = window.__sb; me = window.__user;

  var pq = await sb.from('profiles').select('id, full_name, email, role').eq('is_active', true);
  people = pq.data || [];
  $('tAssignee').innerHTML = '<option value="">Unassigned</option>' +
    people.map(function(p){ return '<option value="'+p.id+'">'+esc(p.full_name||p.email)+'</option>'; }).join('');

  var eq = await sb.from('engagements')
    .select('id, title, clients(business_name)').order('updated_at',{ascending:false});
  var engs = eq.data || [];
  $('eng').innerHTML = engs.length
    ? engs.map(function(e){
        return '<option value="'+e.id+'">'+esc((e.clients&&e.clients.business_name)||e.title||'Untitled')+'</option>';
      }).join('')
    : '<option value="">No engagements yet</option>';
  engId = engs.length ? engs[0].id : null;

  $('eng').addEventListener('change', function(){ engId = this.value; load(); });
  $('filt').addEventListener('change', render);
  $('tStatus').addEventListener('change', toggleBlocked);
  $('editBtn').addEventListener('click', function(){ mode(true); });
  $('close').addEventListener('click', shut);
  $('cancel').addEventListener('click', shut);
  $('veil').addEventListener('click', shut);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') shut(); });

  $('save').addEventListener('click', async function(){
    var title = $('tTitle').value.trim();
    if (!title) return say('Give it a title.', false);
    var payload = {
      engagement_id: engId,
      title: title,
      detail: $('tDetail').value.trim() || null,
      status: $('tStatus').value,
      priority: $('tPriority').value,
      assignee_id: $('tAssignee').value || null,
      due_date: $('tDue').value || null,
      blocked_reason: $('tStatus').value === 'blocked' ? ($('tBlocked').value.trim() || null) : null,
      client_visible: $('tVisible').checked
    };
    if ($('tStatus').value === 'done') payload.completed_at = new Date().toISOString();

    var r = current
      ? await sb.from('tasks').update(payload).eq('id', current.id)
      : await sb.from('tasks').insert(Object.assign({ created_by: me.id, sort_order: tasks.length }, payload));
    if (r.error) return say(r.error.message, false);
    shut(); load();
  });

  $('del').addEventListener('click', async function(){
    if (!current) return;
    if (!window.confirm('Delete this task?')) return;
    var r = await sb.from('tasks').delete().eq('id', current.id);
    if (r.error) return say(r.error.message, false);
    shut(); load();
  });

  initMentions();

  $('cmSend').addEventListener('click', async function(){
    if (!current) return;
    var body = $('cmText').value.trim();
    if (!body) return;
    var ids = mentionedIds(body);

    var btn = this; btn.disabled = true;
    var r = await sb.from('comments').insert({
      engagement_id: engId,
      task_id: current.id,
      author_id: me.id,
      body: body,
      client_visible: $('cmVisible').checked,
      mentions: ids
    });
    btn.disabled = false;
    if (r.error) { $('cmMsg').textContent = r.error.message; $('cmMsg').className='msg show err'; return; }

    $('cmText').value = ''; $('cmVisible').checked = false;
    $('cmMsg').className = 'msg';
    loadComments(current.id);

    // Mentioning someone should reach them, not wait for them to open the board.
    if (ids.length) {
      try {
        var { data:{ session } } = await sb.auth.getSession();
        var mine = (window.__profile && window.__profile.full_name) || me.email;
        for (var i = 0; i < ids.length; i++) {
          var p = people.filter(function(x){ return x.id === ids[i]; })[0];
          if (!p || !p.email) continue;
          await fetch('https://otqrkxjtojqlpzzvqavp.supabase.co/functions/v1/notify', {
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
            body: JSON.stringify({
              to: p.email,
              subject: mine + ' mentioned you \u2014 ' + current.title,
              heading: mine + ' mentioned you',
              body: body,
              facts: [{ label: 'Task', value: current.title }],
              cta_url: 'https://weareverveco.com/board',
              cta_label: 'Open the board'
            })
          });
        }
      } catch (e) { /* the comment is saved either way */ }
    }
  });

  $('cmText').addEventListener('keydown', function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('cmSend').click();
  });

  load();
};
</script>
</body>
</html>
