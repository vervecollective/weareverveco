<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Home — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1160px;margin:0;padding:32px 36px 90px;}
  h1{font-size:23px;font-weight:700;letter-spacing:-.02em;}
  .lede{color:#6b7280;font-size:14px;margin-bottom:26px;}

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px;}
  @media(max-width:860px){.tiles{grid-template-columns:repeat(2,1fr);}}
  .tile{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:17px;text-decoration:none;
    display:block;color:inherit;transition:border-color .12s,box-shadow .12s;}
  a.tile:hover{border-color:#D9531E;box-shadow:0 2px 10px rgba(16,24,40,.07);}
  .tile .n{font-size:25px;font-weight:800;letter-spacing:-.025em;line-height:1;}
  .tile .l{font-size:12.5px;color:#6b7280;margin-top:6px;font-weight:500;}
  .tile .s{font-size:11.5px;color:#9ca3af;margin-top:3px;}
  .tile.good .n{color:#047857;} .tile.warn .n{color:#b45309;} .tile.bad .n{color:#b91c1c;}

  .cols{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;margin-top:22px;}
  @media(max-width:940px){.cols{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:20px;margin-bottom:18px;}
  .card h2{font-size:14px;font-weight:700;margin-bottom:2px;}
  .card .hint{font-size:12.5px;color:#6b7280;margin-bottom:14px;}

  .r{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #f3f4f6;
    text-decoration:none;color:inherit;}
  .r:last-child{border-bottom:none;}
  .r:hover .rt{color:#D9531E;}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .rb{flex:1;min-width:0;}
  .rt{font-size:13.5px;font-weight:600;line-height:1.35;}
  .rs{font-size:12px;color:#6b7280;margin-top:2px;}
  .rr{font-size:12px;font-weight:600;color:#6b7280;white-space:nowrap;flex-shrink:0;margin-top:1px;}
  .rr.late{color:#b91c1c;} .rr.soon{color:#b45309;}

  .none{font-size:13px;color:#9ca3af;padding:12px 0;}
  .load{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .load .nm{font-size:13px;font-weight:600;width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar{flex:1;height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:4px;}
  .load .pc{font-size:12px;color:#6b7280;width:40px;text-align:right;}
  .quick{display:flex;gap:8px;flex-wrap:wrap;}
  .quick a{flex:1;min-width:120px;text-align:center;padding:11px;background:#fff;border:1px solid #e5e7eb;
    border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;color:#111827;}
  .quick a:hover{border-color:#D9531E;color:#D9531E;}
  .hero{background:#111827;color:#fff;border-radius:11px;padding:20px;margin-bottom:18px;}
  .hero b{font-size:15px;font-weight:700;display:block;margin-bottom:4px;}
  .hero p{font-size:13.5px;color:#9ca3af;line-height:1.6;}
  .hero a{color:#fdba8c;font-weight:600;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="greet">Home</h1>
  <p class="lede" id="sub">Loading…</p>

  <div class="tiles" id="tiles"></div>

  <div class="cols">
    <div>
      <div class="card">
        <h2>Needs you</h2>
        <p class="hint">Ordered by what costs most if it waits.</p>
        <div id="attention"><div class="none">Loading…</div></div>
      </div>
      <div class="card">
        <h2>This week</h2>
        <p class="hint">Shoots, milestones and deadlines in the next seven days.</p>
        <div id="week"><div class="none">Loading…</div></div>
      </div>
    </div>

    <div>
      <div id="heroBox"></div>
      <div class="card">
        <h2>Team load</h2>
        <p class="hint">Committed against declared hours.</p>
        <div id="load"><div class="none">Loading…</div></div>
      </div>
      <div class="card">
        <h2>Jump to</h2>
        <div class="quick">
          <a href="/console">Start a call</a>
          <a href="/internal">New engagement</a>
          <a href="/board">Board</a>
          <a href="/capacity">Capacity</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function money(n){return '$'+Math.round(Number(n)||0).toLocaleString();}
function days(d){ if(!d) return null; var t=new Date(); t.setHours(0,0,0,0);
  return Math.round((new Date(d+'T12:00:00')-t)/86400000); }
function rel(d){ var n=days(d); if(n===null) return '';
  if(n<0) return Math.abs(n)+'d late'; if(n===0) return 'Today'; if(n===1) return 'Tomorrow';
  if(n<=7) return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
  return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function relClass(d){ var n=days(d); return n===null?'':(n<0?'late':(n<=2?'soon':'')); }

function row(href, colour, title, sub, right, rcls){
  return '<a class="r" href="'+href+'"><span class="dot" style="background:'+colour+'"></span>'+
    '<span class="rb"><span class="rt">'+esc(title)+'</span>'+
    (sub?'<div class="rs">'+esc(sub)+'</div>':'')+'</span>'+
    (right?'<span class="rr '+(rcls||'')+'">'+esc(right)+'</span>':'')+'</a>';
}

window.vcInit = async function(){
  var sb = window.__sb, me = window.__user, role = window.__role;
  var first = ((window.__profile && window.__profile.full_name) || '').split(' ')[0];
  var h = new Date().getHours();
  $('greet').textContent = (h<12?'Good morning':(h<18?'Good afternoon':'Good evening')) + (first?', '+first:'');

  if (role === 'client' || role === 'contractor') {
    $('sub').textContent = role === 'client'
      ? 'Your project is under My Project.' : 'Your work is under My Work.';
    $('tiles').innerHTML = '';
    document.querySelector('.cols').innerHTML =
      '<div class="card"><h2>Go to your work</h2><div class="quick" style="margin-top:12px">'+
      (role === 'client'
        ? '<a href="/project">My Project</a>'
        : '<a href="/mywork">My Work</a><a href="/jobs">Jobs</a><a href="/pay">Getting paid</a>')+
      '</div></div>';
    return;
  }

  var eq = await sb.from('engagements')
    .select('id, title, stage, amount_total, amount_paid, payment_status, start_date, updated_at, clients(business_name)');
  var engs = eq.data || [];
  var live = engs.filter(function(e){ return ['won','delivering'].indexOf(e.stage) > -1; });

  var outstanding = engs.reduce(function(s,e){
    return s + Math.max((Number(e.amount_total)||0) - (Number(e.amount_paid)||0), 0);
  }, 0);

  var pq = await sb.from('proposals').select('*, engagements(clients(business_name))')
    .in('status',['sent','viewed']);
  var props = pq.data || [];

  var ciq = await sb.from('contractor_invoices')
    .select('*, profiles:contractor_id(full_name)').eq('status','submitted');
  var bills = ciq.data || [];

  var aq = await sb.from('assignments')
    .select('*, engagements(clients(business_name))').eq('status','offered');
  var offers = aq.data || [];

  var tq = await sb.from('tasks')
    .select('*, engagements(clients(business_name))')
    .neq('status','done').neq('status','cancelled');
  var tasks = tq.data || [];
  var lateTasks = tasks.filter(function(t){ var n=days(t.due_date); return n!==null && n<0; });
  var blocked = tasks.filter(function(t){ return t.status==='blocked'; });

  var mq = await sb.from('milestones').select('*, engagements(clients(business_name))').neq('status','done');
  var ms = mq.data || [];

  // Tiles
  $('tiles').innerHTML =
    '<a class="tile '+(outstanding?'warn':'good')+'" href="/internal"><div class="n">'+money(outstanding)+
      '</div><div class="l">Outstanding</div><div class="s">across '+engs.length+' engagements</div></a>'+
    '<a class="tile '+(props.length?'warn':'')+'" href="/internal"><div class="n">'+props.length+
      '</div><div class="l">Proposals out</div><div class="s">'+
      props.filter(function(p){return p.status==='viewed';}).length+' opened</div></a>'+
    '<a class="tile '+(bills.length?'bad':'good')+'" href="/pay"><div class="n">'+bills.length+
      '</div><div class="l">Invoices to approve</div><div class="s">from contractors</div></a>'+
    '<a class="tile '+(stalls.length?'bad':'good')+'" href="/internal"><div class="n">'+stalls.length+
      '</div><div class="l">Going quiet</div><div class="s">need chasing</div></a>'+
    '<a class="tile" href="/capacity"><div class="n">'+live.length+
      '</div><div class="l">Live engagements</div><div class="s">in delivery</div></a>';

  var sq = await sb.from('stalled').select('*').not('reason','is',null);
  var stalls = sq.data || [];

  var STALL = {
    proposal_unopened: ['#b91c1c','has not opened the proposal',
      'Sent %d days ago, never opened. That is a delivery problem \u2014 check the address, or text them the link.'],
    proposal_cold: ['#b45309','opened the proposal and went quiet',
      'Opened %v times but no reply in %d days. Ask directly whether the scope is wrong.'],
    proposal_stale: ['#b45309','has a proposal with no movement',
      'Nothing for %d days. Time for the day-14 message, or close it out.'],
    contract_unsigned: ['#b91c1c','has not signed the agreement',
      'Sent %d days ago. Nothing starts until it is signed \u2014 chase it today.'],
    call_not_held: ['#b45309','booked a call that has not happened',
      'Booked %d days ago with nothing since. Confirm or release the slot.'],
    lead_untouched: ['#D9531E','is an untouched lead',
      '%d days since they came in. The first response window is long gone.'],
    client_quiet: ['#6b7280','has gone quiet',
      'No activity for %d days on a live account. Silence from a paying client is rarely good news.']
  };

  // Needs you — ordered by cost of delay
  var att = [];

  stalls.forEach(function(st){
    var cfg = STALL[st.reason]; if (!cfg) return;
    var msg = cfg[2].replace('%d', st.days_quiet).replace('%v', st.proposal_views || 0);
    att.push(row('/internal', cfg[0],
      (st.business_name || 'A client') + ' ' + cfg[1], msg,
      st.days_quiet + 'd', st.days_quiet > 14 ? 'late' : 'soon'));
  });
  bills.forEach(function(b){
    att.push(row('/pay','#b91c1c','Approve invoice from '+((b.profiles&&b.profiles.full_name)||'a contractor'),
      money(Number(b.amount)+Number(b.expenses||0))+' waiting', 'Pay', 'late'));
  });
  props.filter(function(p){ return p.status==='viewed'; }).forEach(function(p){
    var biz=(p.engagements&&p.engagements.clients&&p.engagements.clients.business_name)||'A client';
    att.push(row('/internal','#D9531E', biz+' opened your proposal',
      'Following up within a day of the first open converts best','Follow up'));
  });
  offers.forEach(function(o){
    var biz=(o.engagements&&o.engagements.clients&&o.engagements.clients.business_name)||'Job';
    att.push(row('/jobs','#b45309', o.role_on_job+' offer unanswered', biz, rel(o.work_date), relClass(o.work_date)));
  });
  blocked.forEach(function(t){
    att.push(row('/board?task='+t.id,'#b91c1c', t.title+' is blocked',
      t.blocked_reason || 'No reason given', 'Unblock'));
  });
  lateTasks.slice(0,4).forEach(function(t){
    att.push(row('/board?task='+t.id,'#b45309', t.title,
      (t.engagements&&t.engagements.clients&&t.engagements.clients.business_name)||'',
      rel(t.due_date), 'late'));
  });
  $('attention').innerHTML = att.length ? att.join('')
    : '<div class="none">Nothing needs you right now.</div>';

  // This week
  var wk = [];
  var dq = await sb.from('assignment_days')
    .select('*, assignments(role_on_job, status, engagements(clients(business_name)))');
  (dq.data||[]).forEach(function(d){
    var n = days(d.work_date);
    if (n === null || n < 0 || n > 7) return;
    var a = d.assignments || {};
    if (a.status === 'declined' || a.status === 'cancelled') return;
    var biz=(a.engagements&&a.engagements.clients&&a.engagements.clients.business_name)||'Shoot';
    wk.push({ d:d.work_date, html: row('/jobs','#7c3aed', biz+' \u2014 '+(a.role_on_job||'Shoot'),
      d.call_time?('Call '+d.call_time.slice(0,5)):'Time TBC', rel(d.work_date), relClass(d.work_date)) });
  });
  ms.forEach(function(m){
    var n = days(m.due_date);
    if (n === null || n < 0 || n > 7) return;
    wk.push({ d:m.due_date, html: row('/internal','#047857', m.label,
      (m.engagements&&m.engagements.clients&&m.engagements.clients.business_name)||'',
      rel(m.due_date), relClass(m.due_date)) });
  });
  wk.sort(function(a,b){ return a.d < b.d ? -1 : 1; });
  $('week').innerHTML = wk.length ? wk.map(function(x){return x.html;}).join('')
    : '<div class="none">Nothing scheduled in the next seven days.</div>';

  // Team load
  var cq = await sb.from('team_capacity').select('*').order('load_pct',{ascending:false});
  var team = cq.data || [];
  $('load').innerHTML = team.length ? team.slice(0,6).map(function(p){
    var pct = Number(p.load_pct)||0;
    var col = pct>100?'#f87171':(pct>85?'#fbbf24':'#34d399');
    return '<div class="load"><span class="nm">'+esc((p.full_name||'').split(' ')[0])+'</span>'+
      '<span class="bar"><i style="width:'+Math.min(pct,100)+'%;background:'+col+'"></i></span>'+
      '<span class="pc">'+pct+'%</span></div>';
  }).join('') : '<div class="none">No capacity set yet.</div>';

  // One thing worth saying, chosen by what is actually true
  var hero = '';
  if (!engs.length) {
    hero = '<b>No clients yet</b><p>The system is ready. The next move is outreach, not more setup \u2014 '+
           'open the <a href="/console">call console</a> when you have one booked.</p>';
  } else if (stalls.filter(function(x){return x.days_quiet > 10;}).length) {
    var n = stalls.filter(function(x){return x.days_quiet > 10;}).length;
    hero = '<b>'+n+(n===1?' deal has':' deals have')+' gone quiet</b><p>Nothing dies loudly \u2014 '+
           'it just stops moving. <a href="/internal">Chase them</a> before they are gone.</p>';
  } else if (bills.length) {
    hero = '<b>Contractors are waiting on you</b><p>You pay on your terms, not the client\u2019s. '+
           '<a href="/pay">Approve them</a> before the day gets away.</p>';
  } else if (props.filter(function(p){return p.status==='viewed';}).length) {
    hero = '<b>A proposal was opened</b><p>The day after a first open is the highest-converting '+
           'moment you get. <a href="/internal">Follow up</a>.</p>';
  } else if (outstanding > 0) {
    hero = '<b>'+money(outstanding)+' outstanding</b><p>Money already earned and not yet collected is '+
           'the cheapest money there is. <a href="/internal">Check the invoices</a>.</p>';
  }
  $('heroBox').innerHTML = hero ? '<div class="hero">'+hero+'</div>' : '';

  $('sub').textContent = live.length
    ? live.length + (live.length===1?' live engagement':' live engagements') + ' \u00b7 ' +
      tasks.length + ' open ' + (tasks.length===1?'task':'tasks')
    : 'Nothing in delivery yet.';
};
</script>
</body>
</html>
