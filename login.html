<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Sign in — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;background:#F6F7F9;color:#111827;
    line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:396px;background:#fff;border-radius:16px;padding:36px 34px;
    box-shadow:0 2px 4px rgba(16,24,40,.04),0 12px 40px rgba(16,24,40,.08);}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:26px;}
  .brand b{font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .brand i{width:26px;height:26px;border-radius:7px;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-style:normal;
    font-size:13px;font-weight:800;}
  h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px;}
  .sub{font-size:14px;color:#5C6470;margin-bottom:24px;}
  label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:6px;}
  input{width:100%;padding:12px 14px;font-size:15px;font-family:inherit;
    border:1px solid #D8DAE0;border-radius:10px;margin-bottom:16px;color:#111827;}
  input:focus{outline:none;border-color:#9A3412;box-shadow:0 0 0 3px rgba(154,52,18,.1);}
  .btn{width:100%;background:#9A3412;color:#fff;border:none;border-radius:10px;padding:13px;
    font:600 15px/1 'Inter',sans-serif;cursor:pointer;transition:background .14s;}
  .btn:hover{background:#7C2D12;}
  .btn:disabled{opacity:.5;cursor:default;}
  .msg{font-size:13.5px;line-height:1.55;margin-top:14px;display:none;}
  .msg.show{display:block;}
  .msg.ok{color:#065F46;} .msg.err{color:#991B1B;}
  .alt{margin-top:20px;padding-top:18px;border-top:1px solid #EFF1F4;
    display:flex;flex-direction:column;gap:9px;}
  .alt a{font-size:13.5px;font-weight:500;color:#5C6470;cursor:pointer;text-decoration:none;}
  .alt a:hover{color:#9A3412;}
  .note{font-size:12.5px;color:#9CA3AF;margin-top:18px;line-height:1.6;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><i>V</i><b>Verve Collective</b></div>

  <h1 id="hd">Sign in</h1>
  <p class="sub" id="sd">We will email you a link. No password needed.</p>

  <label for="email">Your email</label>
  <input type="email" id="email" autocomplete="email" autofocus>

  <div id="pwRow" style="display:none">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>

  <button class="btn" id="go">Email me a link</button>
  <p class="msg" id="msg"></p>

  <div class="alt">
    <a id="usePw">Use a password instead</a>
    <a id="toggleReset" style="display:none">Forgot your password?</a>
  </div>

  <p class="note">Access is by invitation. If you do not have an account yet,
    ask Trae to send you one.</p>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient('https://otqrkxjtojqlpzzvqavp.supabase.co',
  'sb_publishable_OBViGLggbcOKacti5iUonA_QCzw3kBv');

const $ = (i) => document.getElementById(i);
const next = new URLSearchParams(location.search).get('next') || '/hub';

// Already signed in? Do not make them do it again.
const { data: { session } } = await sb.auth.getSession();
if (session) location.replace(next);

let mode = 'magic';   // magic | password | reset

function say(t, ok){
  const m = $('msg');
  m.textContent = t;
  m.className = 'msg show ' + (ok ? 'ok' : 'err');
}

function paint(){
  if (mode === 'magic') {
    $('hd').textContent = 'Sign in';
    $('sd').textContent = 'We will email you a link. No password needed.';
    $('pwRow').style.display = 'none';
    $('go').textContent = 'Email me a link';
    $('usePw').textContent = 'Use a password instead';
    $('toggleReset').style.display = 'none';
  } else if (mode === 'password') {
    $('hd').textContent = 'Sign in';
    $('sd').textContent = 'Enter your email and password.';
    $('pwRow').style.display = '';
    $('go').textContent = 'Sign in';
    $('usePw').textContent = 'Email me a link instead';
    $('toggleReset').style.display = '';
  } else {
    $('hd').textContent = 'Reset your password';
    $('sd').textContent = 'We will email you a link to set a new one.';
    $('pwRow').style.display = 'none';
    $('go').textContent = 'Send reset link';
    $('usePw').textContent = 'Back to sign in';
    $('toggleReset').style.display = 'none';
  }
  $('msg').className = 'msg';
}

$('usePw').addEventListener('click', () => {
  mode = (mode === 'password') ? 'magic' : (mode === 'reset' ? 'magic' : 'password');
  paint();
});
$('toggleReset').addEventListener('click', () => { mode = 'reset'; paint(); });

$('go').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email || email.indexOf('@') < 0) { say('Enter your email address.', false); return; }

  $('go').disabled = true;

  try {
    if (mode === 'magic') {
      /* shouldCreateUser:false is the whole security model here. Without it,
         anyone who types an address gets an account. Access is by invitation,
         so an unknown address must fail rather than quietly become a user. */
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: { shouldCreateUser: false, emailRedirectTo: location.origin + next }
      });
      if (error) {
        say(/not found|signups not allowed|invalid|disabled/i.test(error.message)
          ? 'No account for that address. Ask Trae to invite you first.'
          : error.message, false);
      } else {
        say('Check your email. The link signs you straight in and lasts an hour.', true);
      }

    } else if (mode === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + '/reset.html'
      });
      say(error ? error.message : 'Check your email for the reset link.', !error);

    } else {
      const password = $('password').value;
      if (!password) { $('go').disabled = false; say('Enter your password.', false); return; }
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) say('That email and password do not match.', false);
      else location.href = next;
    }
  } catch (e) {
    say('Something went wrong. Try again.', false);
  }

  $('go').disabled = false;
});

['email','password'].forEach((id) => {
  const el = $(id);
  if (el) el.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
});

paint();
</script>
</body>
</html>
