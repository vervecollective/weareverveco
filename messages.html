<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Messages — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{padding:0 !important;max-width:none !important;height:100vh;display:flex;}
  .list{width:272px;border-right:1px solid #EBECEF;display:flex;flex-direction:column;background:#FCFCFD;}
  .list-h{padding:18px 18px 14px;border-bottom:1px solid #EBECEF;}
  .list-h b{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .newbtn{width:100%;margin-top:12px;padding:10px;border:1px solid #D8DAE0;border-radius:9px;
    background:#fff;font:600 13.5px/1 'Inter',sans-serif;cursor:pointer;color:#111827;}
  .newbtn:hover{border-color:#9A3412;color:#9A3412;}
  .chans{flex:1;overflow-y:auto;padding:8px;}
  .ch{display:flex;gap:11px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:2px;}
  .ch:hover{background:#F3F4F6;} .ch.on{background:#FDF0EB;}
  .ch .av{width:34px;height:34px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    position:relative;background-size:cover;}
  .ch .av i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
    background:#00A870;border:2px solid #FCFCFD;}
  .ch .b{flex:1;min-width:0;}
  .ch .b b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ch .b span{font-size:12px;color:#5C6470;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .ch .n{background:#E2445C;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;
    min-width:19px;height:19px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

  .pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .pane-h{padding:15px 24px;border-bottom:1px solid #EBECEF;display:flex;align-items:center;gap:12px;background:#fff;}
  .pane-h .av{width:34px;height:34px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background-size:cover;}
  .pane-h b{font-size:15px;font-weight:700;}
  .pane-h em{font-size:12.5px;font-style:normal;color:#00875A;font-weight:600;}
  .feed{flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;background:#FCFCFD;}
  .day{text-align:center;font-size:11.5px;font-weight:700;color:#5C6470;margin:16px 0 10px;}
  .m{display:flex;gap:11px;padding:5px 9px;margin-left:-9px;border-radius:10px;position:relative;}
  .m:hover{background:#fff;}
  .m .av{width:32px;height:32px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background-size:cover;}
  .m .bd{flex:1;min-width:0;}
  .m .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:1px;}
  .m .hd b{font-size:13.5px;font-weight:700;}
  .m .hd em{font-size:11px;font-style:normal;color:#9CA3AF;}
  .m .tx{font-size:14.5px;color:#242830;white-space:pre-wrap;word-break:break-word;}
  .m.cont .av{visibility:hidden;height:0;} .m.cont .hd{display:none;}

  .att{margin-top:8px;border-radius:12px;overflow:hidden;max-width:330px;border:1px solid #EBECEF;}
  .att img{display:block;width:100%;}
  .att-f{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#F6F7F9;
    font-size:13px;font-weight:600;text-decoration:none;color:#111827;}
  .rx{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .rx button{border:1px solid #E4E6EA;background:#fff;border-radius:999px;padding:2px 10px;
    font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.7;}
  .rx button.mine{background:#FDF0EB;border-color:#9A3412;}

  .qbar{position:absolute;top:-14px;right:12px;background:#fff;border:1px solid #E4E6EA;
    border-radius:999px;padding:3px 6px;display:none;gap:2px;box-shadow:0 4px 14px rgba(16,24,40,.14);z-index:5;}
  .m:hover .qbar{display:flex;}
  .qbar button{border:none;background:none;font-size:17px;cursor:pointer;padding:3px 5px;
    border-radius:999px;line-height:1;transition:transform .1s;}
  .qbar button:hover{background:#F3F4F6;transform:scale(1.25);}

  .typing{padding:5px 26px 0;font-size:12.5px;color:#5C6470;font-style:italic;height:24px;}
  .dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#9CA3AF;
    margin-right:2px;animation:bl 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

  .compose{padding:15px 24px 22px;border-top:1px solid #EBECEF;display:flex;gap:9px;
    align-items:flex-end;background:#fff;position:relative;}
  .compose textarea{flex:1;border:1px solid #D8DAE0;border-radius:12px;padding:12px 15px;
    font:400 14.5px/1.5 'Inter',sans-serif;resize:none;max-height:150px;color:#111827;}
  .compose textarea:focus{outline:none;border-color:#9A3412;box-shadow:0 0 0 4px rgba(154,52,18,.09);}
  .tool{background:none;border:none;cursor:pointer;padding:9px;border-radius:10px;line-height:0;
    color:#5C6470;display:flex;}
  .tool svg{width:20px;height:20px;} .tool:hover{background:#F3F4F6;color:#111827;}
  .send{background:#9A3412;color:#fff;border:none;border-radius:10px;padding:12px 20px;
    font:600 14px/1 'Inter',sans-serif;cursor:pointer;}
  .send:disabled{opacity:.4;cursor:default;}

  .pick{position:absolute;bottom:80px;left:24px;width:344px;background:#fff;border:1px solid #EBECEF;
    border-radius:14px;box-shadow:0 16px 42px rgba(16,24,40,.2);display:none;overflow:hidden;z-index:40;}
  .pick.on{display:block;}
  .pick-t{display:flex;border-bottom:1px solid #EBECEF;}
  .pick-t button{flex:1;border:none;background:none;padding:11px;font:600 13px/1 'Inter',sans-serif;
    color:#5C6470;cursor:pointer;}
  .pick-t button.on{color:#9A3412;box-shadow:inset 0 -2px 0 #9A3412;}
  .pick-b{max-height:280px;overflow-y:auto;padding:10px;}
  .cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#9CA3AF;padding:8px 4px 6px;}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
  .grid button{border:none;background:none;font-size:21px;cursor:pointer;padding:5px;
    border-radius:8px;line-height:1.25;}
  .grid button:hover{background:#F3F4F6;transform:scale(1.18);}
  .gq{width:100%;border:1px solid #D8DAE0;border-radius:9px;padding:9px 12px;
    font:400 13.5px/1 'Inter',sans-serif;margin-bottom:9px;}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .ggrid img{width:100%;border-radius:9px;cursor:pointer;display:block;background:#F1F2F4;}
  .ggrid img:hover{outline:2px solid #9A3412;}
  .giphy-mark{text-align:center;font-size:10.5px;color:#9CA3AF;padding:10px 0 4px;
    letter-spacing:.03em;}
  .giphy-mark b{color:#5C6470;font-weight:800;letter-spacing:.06em;}
  .nogif{font-size:12.5px;color:#5C6470;padding:16px;text-align:center;line-height:1.6;}

  .veil{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;display:none;}
  .veil.on{display:block;}
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(430px,94vw);
    background:#fff;border-radius:16px;z-index:90;display:none;box-shadow:0 24px 64px rgba(16,24,40,.28);overflow:hidden;}
  .modal.on{display:block;}
  .modal-h{padding:20px 22px 16px;border-bottom:1px solid #EBECEF;}
  .modal-h b{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .modal-h p{font-size:13.5px;color:#5C6470;margin-top:3px;}
  .people{max-height:320px;overflow-y:auto;padding:8px;}
  .pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;}
  .pr:hover{background:#F6F7F9;} .pr.sel{background:#FDF0EB;}
  .pr .pav{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    background-size:cover;position:relative;}
  .pr .pav i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;
    background:#00A870;border:2px solid #fff;}
  .pr .pb{flex:1;min-width:0;}
  .pr .pb b{font-size:14.5px;font-weight:600;display:block;}
  .pr .pb span{font-size:12.5px;color:#5C6470;}
  .pr .tick{width:22px;height:22px;border-radius:50%;border:2px solid #D8DAE0;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .pr.sel .tick{background:#9A3412;border-color:#9A3412;}
  .modal-f{padding:16px 22px;border-top:1px solid #EBECEF;display:flex;gap:10px;align-items:center;}
  .modal-f input{flex:1;border:1px solid #D8DAE0;border-radius:9px;padding:10px 13px;font:400 14px/1 'Inter',sans-serif;}
  .gbtn{background:#9A3412;color:#fff;border:none;border-radius:9px;padding:11px 18px;
    font:600 14px/1 'Inter',sans-serif;cursor:pointer;}
  .gbtn:disabled{opacity:.4;cursor:default;}

  .blank{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;}
  .blank b{display:block;font-size:16px;font-weight:700;margin-bottom:6px;}
  .blank span{font-size:14px;color:#5C6470;max-width:320px;display:block;}
  @media(max-width:820px){.list{width:100%;} .pane{display:none;} .pane.open{display:flex;position:fixed;inset:0;background:#fff;z-index:60;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="list">
    <div class="list-h"><b>Messages</b><button class="newbtn" id="newBtn">+ New message</button></div>
    <div class="chans" id="chans"></div>
  </div>
  <div class="pane" id="pane">
    <div class="blank" id="blank"><div><b>Pick a conversation</b>
      <span>Direct messages for anything that is not about a specific task. Task discussion belongs on the task.</span></div></div>
    <div id="live" style="display:none;flex:1;flex-direction:column;min-height:0">
      <div class="pane-h"><span class="av" id="hAv"></span><b id="hName"></b><em id="hOn"></em></div>
      <div class="feed" id="feed"></div>
      <div class="typing" id="typing"></div>
      <div class="compose">
        <div class="pick" id="pick">
          <div class="pick-t"><button id="tEmo" class="on">Emoji</button><button id="tGif">GIFs</button></div>
          <div class="pick-b" id="pEmo"></div>
          <div class="pick-b" id="pGif" style="display:none">
            <input class="gq" id="gq" type="text" placeholder="Search GIFs">
            <div class="ggrid" id="ggrid"></div>
            <div class="giphy-mark">Powered by <b>GIPHY</b></div>
          </div>
        </div>
        <button class="tool" id="emoBtn" title="Emoji" aria-label="Emoji">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
            <circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/></svg></button>
        <button class="tool" id="fileBtn" title="Attach" aria-label="Attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg></button>
        <input type="file" id="file" style="display:none" accept="image/*,video/*,application/pdf,.doc,.docx">
        <textarea id="box" rows="1" placeholder="Write a message"></textarea>
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="modal" id="modal">
  <div class="modal-h"><b>New message</b><p>One person for a direct message, or several for a group.</p></div>
  <div class="people" id="people"></div>
  <div class="modal-f">
    <input type="text" id="gname" placeholder="Group name (optional)" style="display:none">
    <button class="gbtn" id="startBtn" disabled>Start</button>
  </div>
</div>

<script>
var CATS = [
  ['Reactions', ['\u{1F44D}','\u{1F44E}','\u{1F525}','\u2764\uFE0F','\u{1F602}','\u{1F62D}','\u{1F389}','\u2705',
    '\u274C','\u{1F440}','\u{1F64C}','\u{1F4AF}','\u{1F914}','\u{1F605}','\u{1F64F}','\u26A1',
    '\u{1F91D}','\u{1F4A1}','\u{1F6A8}','\u2B50','\u{1F947}','\u{1F44F}','\u{1F9E0}','\u{1F480}']],
  ['Faces', ['\u{1F600}','\u{1F603}','\u{1F609}','\u{1F60A}','\u{1F60D}','\u{1F60E}','\u{1F929}','\u{1F61C}',
    '\u{1F92A}','\u{1F610}','\u{1F644}','\u{1F62C}','\u{1F613}','\u{1F624}','\u{1F621}','\u{1F92F}',
    '\u{1F628}','\u{1F975}','\u{1F976}','\u{1F910}','\u{1F928}','\u{1F612}','\u{1F634}','\u{1F92B}']],
  ['Hands', ['\u{1F44C}','\u270C\uFE0F','\u{1F91F}','\u{1F918}','\u{1F448}','\u{1F449}','\u{1F446}','\u{1F447}',
    '\u270A','\u{1F44A}','\u{1F91B}','\u{1F91C}','\u{1F4AA}','\u{1F590}\uFE0F','\u270B','\u{1F44B}']],
  ['Work', ['\u{1F3AC}','\u{1F4F8}','\u{1F3A5}','\u{1F5A5}\uFE0F','\u{1F4C8}','\u{1F4C9}','\u{1F4CA}','\u{1F4B0}',
    '\u{1F4B8}','\u{1F9FE}','\u{1F4C5}','\u23F0','\u23F3','\u{1F4CC}','\u{1F4CE}','\u2712\uFE0F',
    '\u{1F680}','\u{1F3AF}','\u{1F50D}','\u{1F6E0}\uFE0F','\u{1F4E3}','\u{1F514}','\u{1F4DD}','\u{1F4C1}']],
  ['Life', ['\u2615','\u{1F355}','\u{1F354}','\u{1F37B}','\u{1F37E}','\u{1F382}','\u{1F308}','\u2600\uFE0F',
    '\u{1F327}\uFE0F','\u2744\uFE0F','\u{1F33F}','\u{1F33B}','\u{1F415}','\u{1F408}','\u{1F697}','\u2708\uFE0F',
    '\u{1F3E0}','\u{1F3D6}\uFE0F','\u{1F3B5}','\u{1F3AE}','\u26BD','\u{1F3C3}','\u{1F6CC}','\u{1F973}']]
];
var QUICK = ['\u{1F44D}','\u2764\uFE0F','\u{1F602}','\u{1F389}','\u{1F525}','\u2705'];

function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function ini(n){return (n||'?').split(' ').map(function(p){return p[0];}).filter(Boolean).join('').slice(0,2).toUpperCase();}

var sb, me, chans=[], people={}, cur=null, online={}, rxMap={}, sub=null, typeTimer=null, picked=[];

function when(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function dayLabel(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return 'Today';
  var y=new Date(n); y.setDate(y.getDate()-1);
  if (d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function otherOf(c){
  var ids=(c.channel_members||[]).map(function(m){return m.profile_id;}).filter(function(x){return x!==me.id;});
  return people[ids[0]] || null;
}
function titleOf(c){
  if (c.name) return c.name;
  var o = otherOf(c);
  return o ? (o.full_name || o.email) : 'Conversation';
}
function avOf(p, cls){
  var tag = (p && p.id) ? ' data-profile="'+p.id+'"' : '';
  if (p && p.avatar_url)
    return '<span class="'+cls+'"'+tag+' style="background-image:url('+esc(p.avatar_url)+')"></span>';
  return '<span class="'+cls+'"'+tag+'>'+ini(p ? (p.full_name||p.email) : '?')+'</span>';
}

async function react(mid, e){
  var ex = (rxMap[mid] || {})[e];
  if (ex && ex.mine) {
    await sb.from('reactions').delete().eq('message_id',mid).eq('profile_id',me.id).eq('emoji',e);
  } else {
    await sb.from('reactions').insert({ message_id:mid, profile_id:me.id, emoji:e });
  }
  paint();
}

async function loadChans(){
  var r = await sb.from('channels')
    .select('*, channel_members(profile_id, last_read_at), messages(body, created_at, author_id)')
    .order('last_message_at',{ascending:false});
  chans = (r.data||[]).filter(function(c){
    return (c.channel_members||[]).some(function(m){ return m.profile_id === me.id; });
  });

  $('chans').innerHTML = chans.length ? chans.map(function(c){
    var msgs = (c.messages||[]).slice().sort(function(a,b){return a.created_at<b.created_at?1:-1;});
    var last = msgs[0];
    var mine = (c.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0];
    var unread = msgs.filter(function(m){
      return m.author_id!==me.id && mine && new Date(m.created_at) > new Date(mine.last_read_at||0);
    }).length;
    var o = otherOf(c);
    var dot = (o && online[o.id]) ? '<i></i>' : '';
    var av = (o && o.avatar_url)
      ? '<span class="av" style="background-image:url('+esc(o.avatar_url)+')">'+dot+'</span>'
      : '<span class="av">'+ini(titleOf(c))+dot+'</span>';
    return '<div class="ch'+(cur&&cur.id===c.id?' on':'')+'" data-id="'+c.id+'">'+av+
      '<span class="b"><b>'+esc(titleOf(c))+'</b>'+
      '<span>'+esc(last ? (last.body||'Sent a file').slice(0,42) : 'No messages yet')+'</span></span>'+
      (unread?'<span class="n">'+unread+'</span>':'')+'</div>';
  }).join('') : '<p style="font-size:13px;color:#5C6470;padding:14px">No conversations yet.</p>';

  $('chans').querySelectorAll('.ch').forEach(function(el){
    el.addEventListener('click', function(){ openCh(el.dataset.id); });
  });
}

async function paint(){
  if (!cur) return;
  var r = await sb.from('messages').select('*').eq('channel_id',cur.id).order('created_at').limit(200);
  var ms = r.data||[];

  rxMap = {};
  if (ms.length){
    var rr = await sb.from('reactions').select('*').in('message_id', ms.map(function(m){return m.id;}));
    (rr.data||[]).forEach(function(x){
      rxMap[x.message_id] = rxMap[x.message_id] || {};
      var e = rxMap[x.message_id][x.emoji] = rxMap[x.message_id][x.emoji] || {n:0,mine:false};
      e.n++; if (x.profile_id===me.id) e.mine = true;
    });
  }

  var html='', lastDay='', lastAuthor='', lastAt=0;
  ms.forEach(function(m){
    var d = dayLabel(m.created_at);
    if (d!==lastDay){ html+='<div class="day">'+d+'</div>'; lastDay=d; lastAuthor=''; }
    var p = people[m.author_id]||{};
    var nm = p.full_name||p.email||'Someone';
    var cont = m.author_id===lastAuthor && (new Date(m.created_at)-lastAt) < 300000;

    var att = '';
    if (m.attachment_url){
      var isImg = (m.attachment_type||'').indexOf('image')===0;
      att = isImg
        ? '<div class="att"><a href="'+esc(m.attachment_url)+'" target="_blank" rel="noopener">'+
          '<img src="'+esc(m.attachment_url)+'" alt=""></a></div>'
        : '<div class="att"><a class="att-f" href="'+esc(m.attachment_url)+'" target="_blank" rel="noopener">'+
          esc(m.attachment_name||'File')+'</a></div>';
    }

    var rx = rxMap[m.id] || {};
    var chips = Object.keys(rx).map(function(e){
      return '<button class="'+(rx[e].mine?'mine':'')+'" data-m="'+m.id+'" data-e="'+e+'">'+e+' '+rx[e].n+'</button>';
    }).join('');
    var rxHtml = chips ? '<div class="rx">'+chips+'</div>' : '';

    /* A faint outlined smiley sits on hover. Clicking it opens the quick bar,
       so the affordance is discoverable rather than assumed. */
    var hint = '<button class="react-hint" data-m="'+m.id+'" data-e="open" title="React">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">'+
      '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>'+
      '<circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/></svg></button>';

    var qb = '<span class="qbar">'+QUICK.map(function(q){
      return '<button data-m="'+m.id+'" data-e="'+q+'">'+q+'</button>';
    }).join('')+'<button data-m="'+m.id+'" data-e="add">+</button></span>';

    html += '<div class="m'+(cont?' cont':'')+'">'+qb+avOf(p,'av')+'<span class="bd">'+
      '<span class="hd"><b>'+esc(nm)+'</b><em>'+when(m.created_at)+'</em>'+hint+'</span>'+
      (m.body ? '<div class="tx">'+esc(m.body)+'</div>' : '')+att+rxHtml+'</span></div>';
    lastAuthor=m.author_id; lastAt=new Date(m.created_at);
  });

  $('feed').innerHTML = html ||
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px">'+
    '<div><div style="font-size:15px;font-weight:600;margin-bottom:5px">No messages yet</div>'+
    '<div style="font-size:13.5px;color:#5C6470;max-width:280px">Say hello. Files, emoji and reactions all work here.</div></div></div>';
  $('feed').scrollTop = $('feed').scrollHeight;

  $('feed').querySelectorAll('.rx button, .qbar button, .react-hint').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.stopPropagation();
      var mid=b.dataset.m, e=b.dataset.e;
      if (e==='open'){
        // Only one bar open at a time — several at once is the noise we removed.
        var bar = b.closest('.m') ? b.closest('.m').querySelector('.qbar') : null;
        var wasOpen = bar && bar.classList.contains('open');
        $('feed').querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
        $('feed').querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
        if (bar && !wasOpen){ bar.classList.add('open'); b.classList.add('active'); }
        return;
      }
      if (e==='add'){ $('pick').dataset.target = mid; $('pick').classList.add('on'); return; }
      $('feed').querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
      $('feed').querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
      await react(mid, e);
    });
  });
}

async function showTyping(){
  if (!cur) return;
  var since = new Date(Date.now()-8000).toISOString();
  var r = await sb.from('typing').select('profile_id').eq('channel_id',cur.id).gte('at',since);
  var who = (r.data||[]).filter(function(t){return t.profile_id!==me.id;})
    .map(function(t){ var p=people[t.profile_id]; return p?(p.full_name||'').split(' ')[0]:'Someone'; });
  $('typing').innerHTML = who.length
    ? '<span class="dots"><i></i><i></i><i></i></span> '+esc(who.join(' and '))+(who.length>1?' are':' is')+' typing'
    : '';
}

async function openCh(id){
  cur = chans.filter(function(c){return c.id===id;})[0];
  if (!cur) return;
  $('blank').style.display='none'; $('live').style.display='flex'; $('pane').classList.add('open');
  var o = otherOf(cur);
  $('hAv').outerHTML = avOf(o,'av').replace('class="av"','class="av" id="hAv"');
  $('hName').textContent = titleOf(cur);
  $('hOn').textContent = (o && online[o.id]) ? 'Active now' : '';
  await paint();
  await sb.from('channel_members').update({last_read_at:new Date().toISOString()})
    .eq('channel_id',id).eq('profile_id',me.id);
  loadChans();

  if (sub) sb.removeChannel(sub);
  sub = sb.channel('m-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+id}, paint)
    .on('postgres_changes',{event:'*',schema:'public',table:'reactions'}, paint)
    .on('postgres_changes',{event:'*',schema:'public',table:'typing',filter:'channel_id=eq.'+id}, showTyping)
    .subscribe();
}

window.vcInit = async function(){
  sb = window.__sb; me = window.__user;

  var pq = await sb.from('profiles').select('id, full_name, email, role, avatar_url').eq('is_active',true);
  (pq.data||[]).forEach(function(p){ people[p.id]=p; });

  async function pres(){
    var since = new Date(Date.now()-5*60000).toISOString();
    var r = await sb.from('presence').select('profile_id').gte('last_seen_at',since);
    online = {}; (r.data||[]).forEach(function(x){ online[x.profile_id]=true; });
  }
  await pres();
  setInterval(function(){ pres().then(loadChans); }, 45000);

  // emoji picker
  $('pEmo').innerHTML = CATS.map(function(c){
    return '<div class="cat">'+c[0]+'</div><div class="grid">'+
      c[1].map(function(e){ return '<button data-e="'+e+'">'+e+'</button>'; }).join('')+'</div>';
  }).join('');

  $('emoBtn').addEventListener('click', function(e){
    e.stopPropagation();
    $('pick').dataset.target='';
    $('pick').classList.toggle('on');
  });
  document.addEventListener('click', function(){
    $('pick').classList.remove('on');
    var f = $('feed');
    if (!f) return;
    f.querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
    f.querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
  });
  $('pick').addEventListener('click', function(e){ e.stopPropagation(); });

  $('tEmo').addEventListener('click', function(){
    $('tEmo').classList.add('on'); $('tGif').classList.remove('on');
    $('pEmo').style.display='block'; $('pGif').style.display='none';
  });
  $('tGif').addEventListener('click', function(){
    $('tGif').classList.add('on'); $('tEmo').classList.remove('on');
    $('pEmo').style.display='none'; $('pGif').style.display='block';
    if (!$('ggrid').innerHTML) loadGifs('');
  });

  $('pEmo').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-e]'); if (!b) return;
    e.stopPropagation();
    var target = $('pick').dataset.target;
    if (target){
      $('pick').dataset.target=''; $('pick').classList.remove('on');
      await react(target, b.dataset.e);
      return;
    }
    $('box').value += b.dataset.e;
    $('box').focus();
  });

  /* GIFs need a free Giphy key. Without one the tab says so rather than
     showing a broken grid \u2014 and the paperclip already handles GIF files. */
  var GIPHY = window.__GIPHY_KEY || 'JXN6mwDA7OUX9lgRKGKudbF0RRFLXBHQ';
  async function loadGifs(q){
    var g = $('ggrid');
    g.innerHTML = '<p class="nogif" style="grid-column:1/-1">Loading\u2026</p>';
    try {
      // Empty query shows what is trending, which is a better opening state
      // than results for a word nobody typed.
      var url = q
        ? 'https://api.giphy.com/v1/gifs/search?api_key='+GIPHY+
          '&q='+encodeURIComponent(q)+'&limit=18&rating=pg-13&lang=en'
        : 'https://api.giphy.com/v1/gifs/trending?api_key='+GIPHY+'&limit=18&rating=pg-13';
      var res = await fetch(url);
      var d = await res.json();
      var items = (d.data||[]).map(function(x){
        var im = x.images || {};
        var small = (im.fixed_width_downsampled || im.fixed_width_small || im.fixed_width || {}).url;
        var full  = (im.fixed_width || im.original || {}).url;
        if (!small || !full) return '';
        return '<img src="'+small+'" data-u="'+full+'" alt="'+
               (x.title||'GIF').replace(/"/g,'')+'" loading="lazy">';
      }).join('');
      g.innerHTML = items || '<p class="nogif" style="grid-column:1/-1">Nothing found. Try another word.</p>';
      g.querySelectorAll('img').forEach(function(img){
        img.addEventListener('click', async function(){
          if (!cur) return;
          await sb.from('messages').insert({
            channel_id:cur.id, author_id:me.id, body:'',
            attachment_url:img.dataset.u, attachment_name:'GIF', attachment_type:'image/gif'
          });
          $('pick').classList.remove('on');
          paint(); loadChans();
        });
      });
    } catch(err){
      g.innerHTML = '<p class="nogif" style="grid-column:1/-1">Could not reach Giphy.</p>';
    }
  }
  var gt;
  $('gq').addEventListener('input', function(){
    clearTimeout(gt);
    var v = this.value.trim() || 'yes';
    gt = setTimeout(function(){ loadGifs(v); }, 400);
  });

  // people picker
  function paintPeople(){
    var opts = Object.keys(people).map(function(k){return people[k];}).filter(function(p){return p.id!==me.id;});
    if (!opts.length){
      $('people').innerHTML = '<p style="font-size:13.5px;color:#5C6470;padding:20px;text-align:center">'+
        'Nobody else has an account yet. Invite someone in People.</p>';
      return;
    }
    var ROLE = {owner:'Owner',account_owner:'Account owner',contractor:'Contractor',client:'Client'};
    $('people').innerHTML = opts.map(function(p){
      var on = picked.indexOf(p.id)>-1;
      var dot = online[p.id] ? '<i></i>' : '';
      var av = p.avatar_url
        ? '<span class="pav" style="background-image:url('+esc(p.avatar_url)+')">'+dot+'</span>'
        : '<span class="pav">'+ini(p.full_name||p.email)+dot+'</span>';
      return '<div class="pr'+(on?' sel':'')+'" data-id="'+p.id+'">'+av+
        '<span class="pb"><b>'+esc(p.full_name||p.email)+'</b>'+
        '<span>'+(ROLE[p.role]||p.role)+(online[p.id]?' \u00b7 Active now':'')+'</span></span>'+
        '<span class="tick">'+(on?'\u2713':'')+'</span></div>';
    }).join('');
    $('people').querySelectorAll('.pr').forEach(function(el){
      el.addEventListener('click', function(){
        var id=el.dataset.id, i=picked.indexOf(id);
        if (i>-1) picked.splice(i,1); else picked.push(id);
        paintPeople();
        $('gname').style.display = picked.length>1 ? 'block' : 'none';
        $('startBtn').disabled = !picked.length;
        $('startBtn').textContent = picked.length>1 ? 'Start group' : 'Start';
      });
    });
  }
  function shutModal(){ $('veil').classList.remove('on'); $('modal').classList.remove('on'); }
  $('veil').addEventListener('click', shutModal);
  $('newBtn').addEventListener('click', function(){
    picked=[]; $('gname').value=''; $('gname').style.display='none';
    $('startBtn').disabled=true; $('startBtn').textContent='Start';
    paintPeople();
    $('veil').classList.add('on'); $('modal').classList.add('on');
  });
  $('startBtn').addEventListener('click', async function(){
    if (!picked.length) return;
    var r = picked.length===1
      ? await sb.rpc('open_dm',{other:picked[0]})
      : await sb.rpc('open_group',{member_ids:picked, group_name:$('gname').value.trim()||null});
    if (r.error) return alert(r.error.message);
    shutModal(); await loadChans(); openCh(r.data);
  });

  // attachments
  $('fileBtn').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', async function(){
    var f = this.files && this.files[0];
    if (!f || !cur) return;
    if (f.size > 10*1024*1024){ alert('Files must be under 10MB.'); this.value=''; return; }
    $('send').disabled = true;
    var path = cur.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    var up = await sb.storage.from('chat').upload(path, f, { contentType: f.type });
    $('send').disabled = false; this.value='';
    if (up.error) return alert(up.error.message);
    var url = sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
    await sb.from('messages').insert({
      channel_id:cur.id, author_id:me.id, body:$('box').value.trim(),
      attachment_url:url, attachment_name:f.name, attachment_type:f.type
    });
    $('box').value='';
    paint(); loadChans();
  });

  // compose
  $('box').addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
    if (!cur || typeTimer) return;
    sb.from('typing').upsert({channel_id:cur.id, profile_id:me.id, at:new Date().toISOString()},
      {onConflict:'channel_id,profile_id'});
    typeTimer = setTimeout(function(){ typeTimer=null; }, 2500);
  });
  async function send(){
    var t = $('box').value.trim();
    if (!t || !cur) return;
    $('box').value=''; $('box').style.height='auto';
    var r = await sb.from('messages').insert({channel_id:cur.id, author_id:me.id, body:t});
    if (r.error) return alert(r.error.message);
    await sb.from('typing').delete().eq('channel_id',cur.id).eq('profile_id',me.id);
    paint(); loadChans();
  }
  $('send').addEventListener('click', send);
  $('box').addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  await loadChans();
  var want = new URLSearchParams(location.search).get('c');
  if (want) openCh(want);
};
</script>
