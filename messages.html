<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<!-- build 1788377775 -->
<title>Messages — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{padding:0 !important;max-width:none !important;height:100vh;display:flex;}
  .list{width:272px;border-right:1px solid #EBECEF;display:flex;flex-direction:column;background:#FCFCFD;}
  .list-h{padding:16px 16px 12px;border-bottom:1px solid #EBECEF;}
  .iconbtn{background:none;border:none;color:#5C6470;cursor:pointer;padding:6px;
    border-radius:7px;display:flex;line-height:0;}
  .iconbtn svg{width:17px;height:17px;}
  .iconbtn:hover{background:#F1F3F6;color:#111827;}
  #searchBox{width:100%;margin-top:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;
    border:1px solid #D8DAE0;border-radius:8px;}
  #searchBox:focus{outline:none;border-color:#9A3412;}
  .list-top{display:flex;align-items:center;gap:2px;}
  .list-top b{flex:1;}
  .iconbtn.primary{background:#111111;color:#fff;margin-left:4px;}
  .iconbtn.primary:hover{background:#D9531E;color:#fff;}
  .iconbtn:focus-visible,.tb:focus-visible{outline:2px solid #D9531E;outline-offset:2px;}

  /* A segmented control in one track, rather than two loose buttons that only
     look grouped when one happens to be filled. */
  .tabs{display:flex;gap:2px;margin-top:12px;background:#F1F3F6;
    border-radius:9px;padding:2px;}
  .tb{flex:1;border:none;background:none;padding:6px;border-radius:7px;
    font:600 12.5px/1 'Inter',sans-serif;color:#6B7280;cursor:pointer;transition:all .12s;}
  .tb:hover{color:#111111;}
  .tb.on{background:#fff;color:#111111;box-shadow:0 1px 2px rgba(16,24,40,.08);}
  /* opacity:0 still reserves layout, so five hidden buttons were eating ~110px
     of a 272px sidebar and squeezing the conversation name to nothing. Lift the
     rail out of flow entirely: it now overlays the row on hover. */
  .acts{position:absolute;top:6px;right:8px;display:flex;gap:1px;opacity:0;
    background:#fff;border:1px solid #E7E9ED;border-radius:8px;padding:1px;
    box-shadow:0 2px 8px rgba(16,24,40,.08);pointer-events:none;transition:opacity .12s;}
  .ch:hover .acts{opacity:1;pointer-events:auto;}
  .act{background:none;border:none;color:#9CA3AF;cursor:pointer;padding:5px;
    border-radius:6px;display:flex;line-height:0;}
  .act svg{width:14px;height:14px;}
  .act:hover{background:#E4E7EC;color:#111827;}
  .act.done{color:#00875A;}
  /* A touch device has no hover, so this used to reveal all five actions on
     every row permanently — the single noisiest thing on the phone. Touch gets
     the overflow button only; the rest live in the menu it already opens. */
  @media(hover:none){
    .acts{opacity:1;}
    .acts .act{display:none;}
    .acts .act[data-menu]{display:flex;padding:7px;}
    .acts .act[data-menu] svg{width:16px;height:16px;}
  }
  .ch .menu{opacity:0;background:none;border:none;color:#9CA3AF;cursor:pointer;
    padding:3px;border-radius:5px;flex-shrink:0;line-height:0;}
  .ch:hover .menu{opacity:1;}
  .ch .menu:hover{background:#E4E7EC;color:#111827;}
  .ch .menu svg{width:15px;height:15px;}
  .ch.muted .b b{color:#9CA3AF;}
  .ac{position:fixed;background:#fff;border:1px solid #E4E6EA;border-radius:10px;
    box-shadow:0 12px 32px rgba(16,24,40,.16);z-index:70;display:none;
    max-height:230px;overflow-y:auto;width:280px;padding:5px;}
  .ac.on{display:block;}
  .ac-i{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;}
  .ac-i.sel,.ac-i:hover{background:#FDF0EB;}
  .ac-i .av{width:24px;height:24px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;}
  .ac-i b{font-size:13.5px;font-weight:600;}
  .ac-i em{font-size:12px;font-style:normal;color:#9CA3AF;display:block;}
  .ac-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#9CA3AF;padding:7px 10px 4px;}
  .chmenu{position:fixed;background:#fff;border:1px solid #E4E6EA;border-radius:10px;
    box-shadow:0 12px 32px rgba(16,24,40,.18);z-index:95;display:none;padding:5px;min-width:186px;}
  .chmenu.on{display:block;}
  .chmenu button{display:block;width:100%;text-align:left;border:none;background:none;
    padding:9px 11px;border-radius:7px;font:500 13.5px/1 'Inter',sans-serif;
    color:#111827;cursor:pointer;}
  .chmenu button:hover{background:#F3F4F6;}
  .chmenu button.danger{color:#991B1B;}
  .hint{font-size:11.5px;color:#9CA3AF;padding:0 24px 10px;}
  .list-h b{font-size:16px;font-weight:680;letter-spacing:-.02em;color:#111111;}

  .chans{flex:1;overflow-y:auto;padding:8px;}
  /* One row, two lines, one accent. Name and time share the first line so the
     eye reads who and when together; the preview owns the second and is the
     only place text is allowed to be quiet. */
  .ch{display:flex;gap:11px;align-items:flex-start;padding:10px 11px;border-radius:10px;
    cursor:pointer;margin-bottom:1px;position:relative;transition:background .12s;}
  .ch:hover{background:#F3F4F6;}
  .ch.on{background:#FDF0EB;}
  /* Selection reads as a state, not a highlighter. */
  .ch.on:before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
    border-radius:0 2px 2px 0;background:#D9531E;}
  .ch .av{width:36px;height:36px;border-radius:50%;background:#111111;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    position:relative;background-size:cover;background-position:center;margin-top:1px;}
  .ch .av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
    background:#00A870;border:2px solid #FCFCFD;}
  .ch .b{flex:1;min-width:0;}
  .ch .r1{display:flex;align-items:baseline;gap:6px;}
  .ch .r1 b{min-width:0;font-size:14px;font-weight:550;letter-spacing:-.01em;color:#111111;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ch .r1 em{margin-left:auto;flex-shrink:0;font-size:11.5px;font-style:normal;
    color:#9CA3AF;font-variant-numeric:tabular-nums;}
  .ch .pin{width:11px;height:11px;flex-shrink:0;color:#9CA3AF;align-self:center;}
  .ch .pv{font-size:12.5px;color:#6B7280;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;display:block;margin-top:1px;}
  /* Unread is carried by weight and colour, not by a shouting badge. */
  .ch.unread .r1 b{font-weight:680;}
  .ch.unread .pv{color:#374151;}
  .ch.unread .r1 em{color:#6B7280;}
  .ch .n{align-self:center;background:#D9531E;color:#fff;font-size:10.5px;font-weight:700;
    border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;
    justify-content:center;padding:0 5px;flex-shrink:0;font-variant-numeric:tabular-nums;}

  .ch-empty{padding:40px 22px;text-align:center;color:#9CA3AF;}
  .ch-empty svg{width:26px;height:26px;margin-bottom:10px;color:#C9CDD4;}
  .ch-empty b{display:block;font-size:13.5px;font-weight:600;color:#374151;margin-bottom:3px;}
  .ch-empty span{font-size:12.5px;line-height:1.5;display:block;max-width:230px;margin:0 auto;}

  .pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .pane-h{padding:15px 24px;border-bottom:1px solid #EBECEF;display:flex;align-items:center;gap:12px;background:#fff;}
  .pane-h .av{width:34px;height:34px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background-size:cover;}
  .hmeta{display:flex;flex-direction:column;min-width:0;}
  .pane-h b{font-size:14.5px;font-weight:650;letter-spacing:-.01em;color:#111111;line-height:1.3;}
  .pane-h .av{cursor:pointer;position:relative;}
  .pane-h .av:hover:after{content:'Edit';position:absolute;inset:0;background:rgba(0,0,0,.55);
    border-radius:50%;color:#fff;font-size:8.5px;font-weight:700;display:flex;
    align-items:center;justify-content:center;}
  .ptabs{margin-left:auto;display:flex;gap:3px;}
  .pt{border:none;background:none;padding:7px 13px;border-radius:8px;
    font:600 12.5px/1 'Inter',sans-serif;color:#5C6470;cursor:pointer;}
  .pt.on{background:#F1F3F6;color:#111827;}
  .files{flex:1;overflow-y:auto;padding:20px 24px;background:#FCFCFD;}
  .pane-h em{font-size:11.5px;font-style:normal;color:#00875A;font-weight:500;line-height:1.3;}
  .pane-h em:empty{display:none;}
  /* A short conversation belongs at the bottom of the column, not floating at
     the top of a mostly empty page. */
  .feed{flex:1;overflow-y:auto;padding:22px 28px 12px;display:flex;flex-direction:column;
    justify-content:flex-end;background:#fff;}
  .feed > .day:first-child{margin-top:0;}

  /* A dated rule, not a floating centred label with nothing holding it. */
  .day{display:flex;align-items:center;gap:12px;margin:22px 0 12px;
    font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#9CA3AF;}
  .day:before,.day:after{content:'';flex:1;height:1px;background:#EEF0F2;}

  .m{display:flex;gap:12px;padding:3px 12px 3px 0;position:relative;}
  .m .av{width:30px;height:30px;border-radius:8px;background:#111111;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;
    background-size:cover;background-position:center;margin-top:2px;}
  .m .bd{flex:1;min-width:0;}
  .m .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
  .m .hd b{font-size:13px;font-weight:620;letter-spacing:-.01em;color:#111111;}
  .m .hd em{font-size:11px;font-style:normal;color:#A2A8B0;font-variant-numeric:tabular-nums;}
  .m .tx{font-size:14px;line-height:1.6;color:#26292F;white-space:pre-wrap;word-break:break-word;}

  /* Consecutive messages keep the gutter but drop the repeated identity. */
  .m.cont{padding-top:1px;}
  .m.cont .av{visibility:hidden;height:0;margin:0;}
  .m.cont .hd{display:flex;height:0;margin:0;}
  .m.cont .hd b,.m.cont .hd em{display:none;}

  /* Actions live on a floating rail at the row's top edge rather than as bare
     glyphs sitting inside the name line. */
  .m .hd .reply-hint,.m .hd .react-hint{
    position:absolute;top:-9px;right:12px;opacity:0;z-index:4;
    background:#fff;border:1px solid #E7E9ED;border-radius:7px;padding:4px 6px;
    box-shadow:0 2px 8px rgba(16,24,40,.09);transition:opacity .12s;}
  .m .hd .reply-hint{right:44px;}
  .m:hover .hd .reply-hint,.m:hover .hd .react-hint{opacity:1;}
  .m .hd .reply-hint:hover,.m .hd .react-hint:hover{border-color:#D8DAE0;color:#111111;}

  /* Threads read as one connected group under their root, not as orphaned
     arrows floating between unrelated messages. */
  .m.reply{margin-left:42px;padding-left:16px;border-left:0;position:relative;}
  .m.reply:before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
    background:#EEF0F2;border-radius:2px;}
  .m.reply .av{width:22px;height:22px;border-radius:6px;font-size:8.5px;}
  .m.reply .tx{font-size:13.5px;}

  /* Agent messages are native to the product: same row, marked identity. */
  .m.agent .av{background:#D9531E;}
  .m.agent .hd b{color:#D9531E;}
  .m.agent .hd b:after{content:'AI';margin-left:6px;font-size:9px;font-weight:700;
    letter-spacing:.06em;padding:1px 4px;border-radius:3px;
    background:#FDF0EB;color:#9A3412;vertical-align:1px;}
  .m.agent .tx{background:none;padding:0;}

  /* Media is contained and captioned rather than dropped in at full bleed. */
  .att{margin-top:8px;border-radius:10px;overflow:hidden;max-width:300px;
    border:1px solid #E7E9ED;background:#fff;}
  .att img{display:block;width:100%;max-height:260px;object-fit:cover;background:#F4F5F7;}
  .att-f{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#FAFAFB;
    font-size:12.5px;font-weight:600;text-decoration:none;color:#111111;}
  .att-f:hover{background:#F4F5F7;}

  .rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;}
  .rx button{border:1px solid #E7E9ED;background:#FAFAFB;border-radius:7px;padding:1px 8px;
    font-size:12px;cursor:pointer;font-family:inherit;line-height:1.8;color:#5C6470;
    font-variant-numeric:tabular-nums;transition:all .12s;}
  .rx button:hover{border-color:#D8DAE0;background:#F4F5F7;}
  .rx button.mine{background:#FDF0EB;border-color:#EFC5AF;color:#9A3412;font-weight:600;}

  .qbar{position:absolute;top:-14px;right:76px;background:#fff;border:1px solid #E7E9ED;
    border-radius:999px;padding:3px 6px;display:none;gap:2px;box-shadow:0 4px 14px rgba(16,24,40,.14);z-index:5;}
  .m:hover .qbar{display:flex;}
  .qbar button{border:none;background:none;font-size:17px;cursor:pointer;padding:3px 5px;
    border-radius:999px;line-height:1;transition:transform .1s;}
  .qbar button:hover{background:#F3F4F6;transform:scale(1.25);}

  .typing{padding:5px 26px 0;font-size:12.5px;color:#5C6470;font-style:italic;height:24px;}
  .dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#9CA3AF;
    margin-right:2px;animation:bl 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

  /* One surface that contains the field and its tools, rather than four loose
     objects sitting on a row: emoji, clip, input, and a red button. */
  .compose{display:flex;flex-direction:column;align-items:stretch;
    padding:14px 28px 18px;border-top:1px solid #EEF0F2;background:#fff;position:relative;}
  .cbox{width:100%;border:1px solid #DDE0E4;border-radius:12px;background:#fff;
    transition:border-color .14s,box-shadow .14s;}
  .cbox:focus-within{border-color:#111111;box-shadow:0 0 0 3px rgba(17,17,17,.06);}
  /* shell.css sets border, radius and background on every textarea with
     !important. The field lives inside .cbox, which draws the box, so those have
     to be undone here or the composer renders as a box inside a box. */
  .compose textarea{display:block;width:100%;resize:none;max-height:160px;
    border:none !important;border-radius:0 !important;background:none !important;
    padding:12px 14px 4px;font:400 14px/1.6 'Inter',sans-serif;color:#111111 !important;}
  .compose textarea:hover{border-color:transparent !important;}
  /* The focus ring belongs on the container, not on the field inside it. */
  .compose textarea:focus{outline:none !important;border-color:transparent !important;
    box-shadow:none !important;}
  .compose textarea::placeholder{color:#A2A8B0 !important;}
  .ctools{display:flex;align-items:center;gap:2px;padding:6px 8px 8px 8px;}
  .tool{background:none;border:none;cursor:pointer;padding:7px;border-radius:8px;line-height:0;
    color:#8A9099;display:flex;transition:all .12s;}
  .tool svg{width:18px;height:18px;}
  .tool:hover{background:#F4F5F7;color:#111111;}
  .chint{flex:1;font-size:11px;color:#B4B9C0;padding-left:6px;user-select:none;}
  .send{background:#111111;color:#fff;border:none;border-radius:8px;padding:8px 16px;
    font:600 13px/1 'Inter',sans-serif;cursor:pointer;transition:background .14s;}
  .send:hover{background:#D9531E;}
  .send:disabled{opacity:.35;cursor:default;background:#111111;}
  .send:focus-visible,.tool:focus-visible{outline:2px solid #D9531E;outline-offset:2px;}

  @media(max-width:860px){ .chint{display:none;} .compose{padding:12px 16px 16px;} }

  .pick{position:absolute;bottom:80px;left:24px;width:344px;background:#fff;border:1px solid #EBECEF;
    border-radius:14px;box-shadow:0 16px 42px rgba(16,24,40,.2);display:none;overflow:hidden;z-index:40;}
  .pick.on{display:block;}
  .pick-t{display:flex;border-bottom:1px solid #EBECEF;}
  .pick-t button{flex:1;border:none;background:none;padding:11px;font:600 13px/1 'Inter',sans-serif;
    color:#5C6470;cursor:pointer;}
  .pick-t button.on{color:#9A3412;box-shadow:inset 0 -2px 0 #9A3412;}
  .pick-b{max-height:280px;overflow-y:auto;padding:10px;}
  .cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#9CA3AF;padding:8px 4px 6px;}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
  .grid button{border:none;background:none;font-size:21px;cursor:pointer;padding:5px;
    border-radius:8px;line-height:1.25;}
  .grid button:hover{background:#F3F4F6;transform:scale(1.18);}
  .gq{width:100%;border:1px solid #D8DAE0;border-radius:9px;padding:9px 12px;
    font:400 13.5px/1 'Inter',sans-serif;margin-bottom:9px;}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .ggrid img{width:100%;border-radius:9px;cursor:pointer;display:block;background:#F1F2F4;}
  .ggrid img:hover{outline:2px solid #9A3412;}
  .giphy-mark{text-align:center;font-size:10.5px;color:#9CA3AF;padding:10px 0 4px;
    letter-spacing:.03em;}
  .giphy-mark b{color:#5C6470;font-weight:800;letter-spacing:.06em;}
  .nogif{font-size:12.5px;color:#5C6470;padding:16px;text-align:center;line-height:1.6;}

  .veil{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;display:none;}
  .veil.on{display:block;}
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(430px,94vw);
    background:#fff;border-radius:16px;z-index:90;display:none;box-shadow:0 24px 64px rgba(16,24,40,.28);overflow:hidden;}
  .modal.on{display:block;}
  .modal-h{padding:20px 22px 16px;border-bottom:1px solid #EBECEF;}
  .modal-h b{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .modal-h p{font-size:13.5px;color:#5C6470;margin-top:3px;}
  .people{max-height:320px;overflow-y:auto;padding:8px;}
  .pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;}
  .pr:hover{background:#F6F7F9;} .pr.sel{background:#FDF0EB;}
  .pr .pav{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    background-size:cover;position:relative;}
  .pr .pav i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;
    background:#00A870;border:2px solid #fff;}
  .pr .pb{flex:1;min-width:0;}
  .pr .pb b{font-size:14.5px;font-weight:600;display:block;}
  .pr .pb span{font-size:12.5px;color:#5C6470;}
  .pr .tick{width:22px;height:22px;border-radius:50%;border:2px solid #D8DAE0;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .pr.sel .tick{background:#9A3412;border-color:#9A3412;}
  .modal-f{padding:16px 22px;border-top:1px solid #EBECEF;display:flex;gap:10px;align-items:center;}
  .modal-f input{flex:1;border:1px solid #D8DAE0;border-radius:9px;padding:10px 13px;font:400 14px/1 'Inter',sans-serif;}
  .gbtn{background:#9A3412;color:#fff;border:none;border-radius:9px;padding:11px 18px;
    font:600 14px/1 'Inter',sans-serif;cursor:pointer;}
  .gbtn:disabled{opacity:.4;cursor:default;}

  .blank{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;}
  .blank b{display:block;font-size:16px;font-weight:700;margin-bottom:6px;}
  .blank span{font-size:14px;color:#5C6470;max-width:320px;display:block;}
  /* On a phone the conversation takes the whole screen, which is right — but
     nothing ever removed .open, so tapping a conversation trapped you there
     with the app shell covered and no way back. */
  @media(max-width:820px){
    .list{width:100%;}
    .pane{display:none;}
    .pane.open{display:flex;position:fixed;inset:0;background:#fff;z-index:60;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
    .back{display:flex !important;}
    .pane-h{padding:12px 16px;}
    .feed{padding:16px 16px 8px;}
    .m.reply{margin-left:30px;padding-left:12px;}
  }
  .back{display:none;background:none;border:none;cursor:pointer;color:#5C6470;
    padding:6px;margin-left:-6px;border-radius:8px;line-height:0;flex-shrink:0;}
  .back:hover{background:#F4F5F7;color:#111111;}
  .back svg{width:20px;height:20px;}

  /* Search results and the files grid were the two surfaces still styled like
     the old admin list. */
  .sr{padding:10px 11px;border-radius:9px;cursor:pointer;margin-bottom:2px;transition:background .12s;}
  .sr:hover{background:#F4F5F7;}
  .sr b{font-size:13px;font-weight:620;display:block;color:#111111;letter-spacing:-.01em;}

<body>
<div class="wrap">
  <div class="list">
    <div class="list-h">
      <div class="list-top">
        <b>Messages</b>
        <button class="iconbtn" id="searchBtn" title="Search messages" aria-label="Search messages">

          <div class="pick-b" id="pEmo"></div>

            <div class="ggrid" id="ggrid"></div>
            <div class="giphy-mark">Powered by <b>GIPHY</b></div>
          </div>
        </div>
        <div class="cbox">
          <textarea id="box" rows="1" placeholder="Write a message"></textarea>
          <div class="ctools">
            <button class="tool" id="emoBtn" title="Emoji" aria-label="Emoji">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
                <circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/></svg></button>
            <button class="tool" id="fileBtn" title="Attach" aria-label="Attach a file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg></button>
            <input type="file" id="file" style="display:none" accept="image/*,video/*,application/pdf,.doc,.docx">
            <span class="chint">Shift + Enter for a new line</span>
            <button class="send" id="send">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="modal" id="modal">
  <div class="modal-h"><b>New message</b><p>One person for a direct message, or several for a group.</p></div>
  <div class="people" id="people"></div>

    <input type="text" id="gname" placeholder="Group name (optional)" style="display:none">

<script>
var CATS = [
  ['Reactions', ['\u{1F44D}','\u{1F44E}','\u{1F525}','\u2764\uFE0F','\u{1F602}','\u{1F62D}','\u{1F389}','\u2705',
    '\u274C','\u{1F440}','\u{1F64C}','\u{1F4AF}','\u{1F914}','\u{1F605}','\u{1F64F}','\u26A1',
    '\u{1F91D}','\u{1F4A1}','\u{1F6A8}','\u2B50','\u{1F947}','\u{1F44F}','\u{1F9E0}','\u{1F480}']],
  ['Faces', ['\u{1F600}','\u{1F603}','\u{1F609}','\u{1F60A}','\u{1F60D}','\u{1F60E}','\u{1F929}','\u{1F61C}',
    '\u{1F92A}','\u{1F610}','\u{1F644}','\u{1F62C}','\u{1F613}','\u{1F624}','\u{1F621}','\u{1F92F}',
    '\u{1F628}','\u{1F975}','\u{1F976}','\u{1F910}','\u{1F928}','\u{1F612}','\u{1F634}','\u{1F92B}']],
  ['Hands', ['\u{1F44C}','\u270C\uFE0F','\u{1F91F}','\u{1F918}','\u{1F448}','\u{1F449}','\u{1F446}','\u{1F447}',
    '\u270A','\u{1F44A}','\u{1F91B}','\u{1F91C}','\u{1F4AA}','\u{1F590}\uFE0F','\u270B','\u{1F44B}']],
  ['Work', ['\u{1F3AC}','\u{1F4F8}','\u{1F3A5}','\u{1F5A5}\uFE0F','\u{1F4C8}','\u{1F4C9}','\u{1F4CA}','\u{1F4B0}',
    '\u{1F4B8}','\u{1F9FE}','\u{1F4C5}','\u23F0','\u23F3','\u{1F4CC}','\u{1F4CE}','\u2712\uFE0F',
    '\u{1F680}','\u{1F3AF}','\u{1F50D}','\u{1F6E0}\uFE0F','\u{1F4E3}','\u{1F514}','\u{1F4DD}','\u{1F4C1}']],
  ['Life', ['\u2615','\u{1F355}','\u{1F354}','\u{1F37B}','\u{1F37E}','\u{1F382}','\u{1F308}','\u2600\uFE0F',
    '\u{1F327}\uFE0F','\u2744\uFE0F','\u{1F33F}','\u{1F33B}','\u{1F415}','\u{1F408}','\u{1F697}','\u2708\uFE0F',
    '\u{1F3E0}','\u{1F3D6}\uFE0F','\u{1F3B5}','\u{1F3AE}','\u26BD','\u{1F3C3}','\u{1F6CC}','\u{1F973}']]
];
var QUICK = ['\u{1F44D}','\u2764\uFE0F','\u{1F602}','\u{1F389}','\u{1F525}','\u2705'];

function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function ini(n){return (n||'?').split(' ').map(function(p){return p[0];}).filter(Boolean).join('').slice(0,2).toUpperCase();}

var sb, me, chans=[], people={}, cur=null, online={}, rxMap={}, sub=null, typeTimer=null, picked=[];
/* The message being replied to, or null. Held here rather than on the DOM so a
   re-render of the feed cannot silently drop it. */
var replyTo = null;

function clearReply(){
  replyTo = null;
  var bar = document.getElementById('replybar');
  if (bar) bar.style.display = 'none';
}

function startReply(id){
  var m = (window.__msgs || []).filter(function(x){ return x.id === id; })[0];
  if (!m) return;
  replyTo = id;
  var p = people[m.author_id] || {};
  var who = p.full_name || p.email || 'Someone';
  var snippet = (m.body || m.attachment_name || 'a file').slice(0, 80);
  document.getElementById('replyto').innerHTML =
    'Replying to <b>' + esc(who) + '</b> \u2014 ' + esc(snippet);
  document.getElementById('replybar').style.display = 'flex';
  var box = document.getElementById('box');
  if (box) box.focus();
}

/* Delegated from document: the feed is rebuilt on every paint, so a listener
   bound to a button inside it would not survive. */
document.addEventListener('click', function(e){
  var r = e.target.closest && e.target.closest('[data-reply]');
  if (r){ e.stopPropagation(); startReply(r.dataset.reply); return; }
  if (e.target && e.target.id === 'replyx') clearReply();
});
var tab='all', searching=false;

function when(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function dayLabel(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return 'Today';
  var y=new Date(n); y.setDate(y.getDate()-1);
  if (d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function otherOf(c){
  var ids=(c.channel_members||[]).map(function(m){return m.profile_id;}).filter(function(x){return x!==me.id;});
  return people[ids[0]] || null;
}
function titleOf(c){
  if (c.name) return c.name;
  var o = otherOf(c);
  return o ? (o.full_name || o.email) : 'Conversation';
}
function avOf(p, cls){
  var tag = (p && p.id) ? ' data-profile="'+p.id+'"' : '';
  if (p && p.avatar_url)
    return '<span class="'+cls+'"'+tag+' style="background-image:url('+esc(p.avatar_url)+')"></span>';
  return '<span class="'+cls+'"'+tag+'>'+ini(p ? (p.full_name||p.email) : '?')+'</span>';
}

async function react(mid, e){
  var ex = (rxMap[mid] || {})[e];
  if (ex && ex.mine) {
    await sb.from('reactions').delete().eq('message_id',mid).eq('profile_id',me.id).eq('emoji',e);
  } else {
    await sb.from('reactions').insert({ message_id:mid, profile_id:me.id, emoji:e });
  }
  paint();
}

/* The chat bucket is private. Anything stored as a bare path is signed for a
   short window at render time; anything already absolute (Giphy, and the one
   legacy public URL) is passed straight through. A stored permanent URL is a
   permanent unauthenticated link, which is exactly what we stopped doing. */
var signedCache = {};
function isPath(v){ return !!v && !/^https?:\/\//i.test(v); }

async function signPaths(values){
  var want = [];
  values.forEach(function(v){
    if (isPath(v) && !signedCache[v] && want.indexOf(v) === -1) want.push(v);
  });
  if (!want.length) return;
  var r = await sb.storage.from('chat').createSignedUrls(want, 3600);
  (r.data || []).forEach(function(row){
    if (row && row.signedUrl && !row.error) signedCache[row.path] = row.signedUrl;
  });
}
function srcFor(v){ return isPath(v) ? (signedCache[v] || '') : (v || ''); }

async function loadChans(){
  var r = await sb.from('channels')
    .select('*, image_url, channel_members(profile_id, last_read_at, muted, pinned, manually_unread), messages(body, created_at, author_id), engagements(title, clients(business_name))')
    .order('last_message_at',{ascending:false});
  chans = (r.data||[]).filter(function(c){
    return (c.channel_members||[]).some(function(m){ return m.profile_id === me.id; });
  });

  await signPaths(chans.map(function(c){ return c.image_url; }));

  chans.sort(function(a,b){
    var ap = ((a.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0]||{}).pinned;
    var bp = ((b.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0]||{}).pinned;
    if (!!ap !== !!bp) return ap ? -1 : 1;
    return (a.last_message_at < b.last_message_at) ? 1 : -1;
  });

  var list = chans.filter(function(c){
    if (tab !== 'unread') return true;
    var msgs = (c.messages||[]);
    var mine = (c.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0];
    if (mine && mine.manually_unread) return true;
    return msgs.some(function(m){
      return m.author_id!==me.id && mine && new Date(m.created_at) > new Date(mine.last_read_at||0);
    });
  });

  $('chans').innerHTML = list.length ? list.map(function(c){
    var msgs = (c.messages||[]).slice().sort(function(a,b){return a.created_at<b.created_at?1:-1;});
    var last = msgs[0];
    var mine = (c.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0];
    var unread = msgs.filter(function(m){
      return m.author_id!==me.id && mine && new Date(m.created_at) > new Date(mine.last_read_at||0);
    }).length;
    var o = otherOf(c);
    var dot = (o && online[o.id]) ? '<i></i>' : '';
    var pic = srcFor(c.image_url) || (o && o.avatar_url);
    var av = pic
      ? '<span class="av" style="background-image:url('+esc(pic)+')">'+dot+'</span>'
      : '<span class="av">'+ini(titleOf(c))+dot+'</span>';
    var mineRow = (c.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0];
    var pinned = !!(mineRow && mineRow.pinned);
    var pinMark = pinned
      ? '<svg class="pin" viewBox="0 0 24 24" fill="currentColor" aria-label="Pinned">'+
        '<path d="M12 2 9.5 8.5 3 9.5l5 4.5-1.5 6.5L12 17l5.5 3.5L16 14l5-4.5-6.5-1z"/></svg>'
      : '';

    return '<div class="ch'+(cur&&cur.id===c.id?' on':'')+
      ((mineRow&&mineRow.muted)?' muted':'')+(unread?' unread':'')+
      '" data-id="'+c.id+'">'+av+
      '<span class="b">'+
        '<span class="r1">'+pinMark+'<b>'+esc(titleOf(c))+'</b>'+
          (last ? '<em>'+when(last.created_at)+'</em>' : '')+'</span>'+
        '<span class="pv">'+esc(last ? (last.body||'Sent a file') : 'No messages yet')+'</span>'+
      '</span>'+
      (unread?'<span class="n">'+unread+'</span>':'')+
      /* Four inline actions instead of a popup. A hidden menu that has to be
         positioned is one more thing that can fail; these cannot. */
      '<span class="acts">'+
        '<button class="act" data-menu="'+c.id+'" title="More">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/>'+
          '<circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>'+
        '<button class="act" data-act="pin" data-c="'+c.id+'" title="'+
          ((mineRow&&mineRow.pinned)?'Unpin':'Pin to top')+'">'+
          '<svg viewBox="0 0 24 24" fill="'+((mineRow&&mineRow.pinned)?'currentColor':'none')+
          '" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+
          '<path d="M12 2 9.5 8.5 3 9.5l5 4.5-1.5 6.5L12 17l5.5 3.5L16 14l5-4.5-6.5-1z"/></svg></button>'+
        '<button class="act" data-act="mute" data-c="'+c.id+'" title="'+
          ((mineRow&&mineRow.muted)?'Unmute':'Mute')+'">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'+
          (mineRow&&mineRow.muted
            ? '<path d="M11 5 6 9H3v6h3l5 4zM23 9l-6 6M17 9l6 6"/>'
            : '<path d="M11 5 6 9H3v6h3l5 4zM16 9a5 5 0 0 1 0 6"/>')+
          '</svg></button>'+
        '<button class="act" data-act="unread" data-c="'+c.id+'" title="Mark unread">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'+
          '<circle cx="12" cy="12" r="4"/></svg></button>'+
        '<button class="act" data-act="copy" data-c="'+c.id+'" title="Copy link">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">'+
          '<path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>'+
      '</span>'+
      '</div>';
  }).join('') : '<div class="ch-empty">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" '+
      'stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-4-.9L3 21l1.9-4.6A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>'+
      '</svg>'+
      '<b>'+(tab==='unread' ? 'Nothing unread' : 'No conversations yet')+'</b>'+
      '<span>'+(tab==='unread'
        ? 'Everything here has been read.'
        : 'Start one with a teammate, a contractor, or a client.')+'</span></div>';

  /* No per-render listeners: they are re-attached on every paint and easy to
     lose. One delegated listener on document survives every re-render. */

  $('chans').querySelectorAll('.ch').forEach(function(el){
    el.addEventListener('click', function(e){
      if (e.target.closest('[data-act]') || e.target.closest('[data-menu]')) return;
      openCh(el.dataset.id);
    });
  });
}

async function paint(){
  if (!cur) return;
  var r = await sb.from('messages').select('*').eq('channel_id',cur.id).order('created_at').limit(200);
  var ms = r.data||[];

  rxMap = {};
  if (ms.length){
    var rr = await sb.from('reactions').select('*').in('message_id', ms.map(function(m){return m.id;}));
    (rr.data||[]).forEach(function(x){
      rxMap[x.message_id] = rxMap[x.message_id] || {};
      var e = rxMap[x.message_id][x.emoji] = rxMap[x.message_id][x.emoji] || {n:0,mine:false};
      e.n++; if (x.profile_id===me.id) e.mine = true;
    });
  }

  window.__msgs = ms;
  await signPaths(ms.map(function(m){ return m.attachment_url; }));

  /* Replies hang off their root rather than landing at the bottom of the feed in
     arrival order, which is what made a busy channel hard to follow. */
  var kids = {};
  ms.forEach(function(m){
    if (!m.parent_id) return;
    (kids[m.parent_id] = kids[m.parent_id] || []).push(m);
  });
  var roots = ms.filter(function(m){ return !m.parent_id; });

  var html='', lastDay='', lastAuthor='', lastAt=0;
  roots.forEach(function(m){
    var d = dayLabel(m.created_at);
    if (d!==lastDay){ html+='<div class="day">'+d+'</div>'; lastDay=d; lastAuthor=''; }
    var p = people[m.author_id]||{};
    var nm = p.full_name||p.email||'Someone';
    var cont = m.author_id===lastAuthor && (new Date(m.created_at)-lastAt) < 300000;

    var att = '';
    if (m.attachment_url){
      var isImg = (m.attachment_type||'').indexOf('image')===0;
      var aurl = srcFor(m.attachment_url);
      att = isImg
        ? '<div class="att"><a href="'+esc(aurl)+'" target="_blank" rel="noopener">'+
          '<img src="'+esc(aurl)+'" alt=""></a></div>'
        : '<div class="att"><a class="att-f" href="'+esc(aurl)+'" target="_blank" rel="noopener">'+
          esc(m.attachment_name||'File')+'</a></div>';
    }

    var rx = rxMap[m.id] || {};
    var chips = Object.keys(rx).map(function(e){
      return '<button class="'+(rx[e].mine?'mine':'')+'" data-m="'+m.id+'" data-e="'+e+'">'+e+' '+rx[e].n+'</button>';
    }).join('');
    var rxHtml = chips ? '<div class="rx">'+chips+'</div>' : '';

    /* A faint outlined smiley sits on hover. Clicking it opens the quick bar,
       so the affordance is discoverable rather than assumed. */
    var reply = '<button class="reply-hint" data-reply="'+m.id+'" title="Reply">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
      'stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/>'+
      '<path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg></button>';

    var hint = '<button class="react-hint" data-m="'+m.id+'" data-e="open" title="React">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">'+
      '<circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>'+
      '<circle cx="9" cy="10" r=".7" fill="currentColor"/><circle cx="15" cy="10" r=".7" fill="currentColor"/></svg></button>';

    var qb = '<span class="qbar">'+QUICK.map(function(q){
      return '<button data-m="'+m.id+'" data-e="'+q+'">'+q+'</button>';
    }).join('')+'<button data-m="'+m.id+'" data-e="add">+</button></span>';

    html += '<div class="m'+(cont?' cont':'')+(m.author_kind==='agent'?' agent':'')+'">'+
      qb+avOf(p,'av')+'<span class="bd">'+
      '<span class="hd"><b>'+esc(nm)+'</b><em>'+when(m.created_at)+'</em>'+reply+hint+'</span>'+
      (m.body ? '<div class="tx">'+esc(m.body)+'</div>' : '')+att+rxHtml+'</span></div>';

    (kids[m.id] || []).forEach(function(k){
      var kp = people[k.author_id]||{};
      var kn = kp.full_name||kp.email||'Someone';
      var katt = '';
      if (k.attachment_url){
        var kimg = (k.attachment_type||'').indexOf('image')===0;
        var kurl = srcFor(k.attachment_url);
        katt = kimg
          ? '<div class="att"><a href="'+esc(kurl)+'" target="_blank" rel="noopener">'+
            '<img src="'+esc(kurl)+'" alt=""></a></div>'
          : '<div class="att"><a class="att-f" href="'+esc(kurl)+'" target="_blank" rel="noopener">'+
            esc(k.attachment_name||'File')+'</a></div>';
      }
      var krx = rxMap[k.id] || {};
      var kchips = Object.keys(krx).map(function(e){
        return '<button class="'+(krx[e].mine?'mine':'')+'" data-m="'+k.id+'" data-e="'+e+'">'+e+' '+krx[e].n+'</button>';
      }).join('');
      html += '<div class="m reply'+(k.author_kind==='agent'?' agent':'')+'">'+
        avOf(kp,'av')+'<span class="bd">'+
        '<span class="hd"><b>'+esc(kn)+'</b><em>'+when(k.created_at)+'</em></span>'+
        (k.body ? '<div class="tx">'+esc(k.body)+'</div>' : '')+katt+
        (kchips ? '<div class="rx">'+kchips+'</div>' : '')+'</span></div>';
    });

    lastAuthor=m.author_id; lastAt=new Date(m.created_at);
  });

  $('feed').innerHTML = html ||
    '<div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px">'+
    '<div><div style="font-size:15px;font-weight:600;margin-bottom:5px">No messages yet</div>'+
    '<div style="font-size:13.5px;color:#5C6470;max-width:280px">Say hello. Files, emoji and reactions all work here.</div></div></div>';
  $('feed').scrollTop = $('feed').scrollHeight;

  $('feed').querySelectorAll('.rx button, .qbar button, .react-hint').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.stopPropagation();
      var mid=b.dataset.m, e=b.dataset.e;
      if (e==='open'){
        // Only one bar open at a time — several at once is the noise we removed.
        var bar = b.closest('.m') ? b.closest('.m').querySelector('.qbar') : null;
        var wasOpen = bar && bar.classList.contains('open');
        $('feed').querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
        $('feed').querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
        if (bar && !wasOpen){ bar.classList.add('open'); b.classList.add('active'); }
        return;
      }
      if (e==='add'){ $('pick').dataset.target = mid; $('pick').classList.add('on'); return; }
      $('feed').querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
      $('feed').querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
      await react(mid, e);
    });
  });
}

async function showTyping(){
  if (!cur) return;
  var since = new Date(Date.now()-8000).toISOString();
  var r = await sb.from('typing').select('profile_id').eq('channel_id',cur.id).gte('at',since);
  var who = (r.data||[]).filter(function(t){return t.profile_id!==me.id;})
    .map(function(t){ var p=people[t.profile_id]; return p?(p.full_name||'').split(' ')[0]:'Someone'; });
  $('typing').innerHTML = who.length
    ? '<span class="dots"><i></i><i></i><i></i></span> '+esc(who.join(' and '))+(who.length>1?' are':' is')+' typing'
    : '';
}

async function openCh(id){
  cur = chans.filter(function(c){return c.id===id;})[0];
  if (!cur) return;
  clearReply();
  $('blank').style.display='none'; $('live').style.display='flex'; $('pane').classList.add('open');
  var o = otherOf(cur);
  var hpic = srcFor(cur.image_url) || (o && o.avatar_url);
  $('hAv').outerHTML = hpic
    ? '<span class="av" id="hAv" style="background-image:url('+esc(hpic)+')"></span>'
    : '<span class="av" id="hAv">'+ini(titleOf(cur))+'</span>';
  $('hName').textContent = titleOf(cur);
  /* A conversation is rarely just a name. channels.engagement_id already links
     it to a piece of work; the header never said so. */
  var eng = cur.engagements;
  var members = (cur.channel_members || []).length;
  var ctx = '';
  if (eng && eng.title) {
    ctx = eng.title + (eng.clients && eng.clients.business_name
      ? ' \u00B7 ' + eng.clients.business_name : '');
  } else if (members > 2) {
    ctx = members + ' members';
  } else if (o && online[o.id]) {
    ctx = 'Active now';
  }
  $('hOn').textContent = ctx;
  $('hOn').style.color = (ctx === 'Active now') ? '#00875A' : '#8A9099';
  showPane('chat');
  await paint();
  await sb.from('channel_members')
    .update({ last_read_at:new Date().toISOString(), manually_unread:false })
    .eq('channel_id',id).eq('profile_id',me.id);
  loadChans();

  if (sub) sb.removeChannel(sub);
  sub = sb.channel('m-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+id}, paint)
    .on('postgres_changes',{event:'*',schema:'public',table:'reactions'}, paint)
    .on('postgres_changes',{event:'*',schema:'public',table:'typing',filter:'channel_id=eq.'+id}, showTyping)
    .subscribe();
}

/* Per-chat actions live where the chat does, not in a settings page. */
function openChMenu(anchor, cid){
  var c = chans.filter(function(x){ return x.id === cid; })[0];
  if (!c) return;
  var mine = (c.channel_members||[]).filter(function(m){ return m.profile_id === me.id; })[0] || {};
  var mn = document.getElementById('chMenu');

  mn.innerHTML =
    '<button data-a="pin">' + (mine.pinned ? 'Unpin' : 'Pin to top') + '</button>' +
    '<button data-a="unread">Mark as unread</button>' +
    '<button data-a="mute">' + (mine.muted ? 'Unmute' : 'Mute') + '</button>' +
    '<button data-a="copy">Copy link</button>' +
    (c.kind === 'group' ? '<button class="danger" data-a="leave">Leave group</button>' : '');

  var r = anchor.getBoundingClientRect();
  mn.style.top  = Math.min(r.bottom + 6, window.innerHeight - 190) + 'px';
  mn.style.left = Math.min(r.left - 150, window.innerWidth - 200) + 'px';
  mn.classList.add('on');

  mn.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', async function(e){
      e.stopPropagation();
      mn.classList.remove('on');
      var a = b.dataset.a;

      if (a === 'pin') {
        await sb.from('channel_members').update({ pinned: !mine.pinned })
          .eq('channel_id', cid).eq('profile_id', me.id);
        loadChans();

      } else if (a === 'unread') {
        await sb.from('channel_members')
          .update({ manually_unread: true, last_read_at: new Date(0).toISOString() })
          .eq('channel_id', cid).eq('profile_id', me.id);
        if (cur && cur.id === cid) { cur = null; $('live').style.display='none'; $('blank').style.display='flex'; }
        loadChans();

      } else if (a === 'mute') {
        await sb.from('channel_members').update({ muted: !mine.muted })
          .eq('channel_id', cid).eq('profile_id', me.id);
        loadChans();

      } else if (a === 'copy') {
        navigator.clipboard.writeText(location.origin + '/messages?c=' + cid);
        b.textContent = 'Copied';

      } else if (a === 'leave') {
        var ok = window.vcConfirm
          ? await window.vcConfirm({ title:'Leave this group?',
              body:'You stop receiving its messages. Others keep the conversation.',
              confirm:'Leave' })
          : true;
        if (!ok) return;
        await sb.from('channel_members').delete().eq('channel_id', cid).eq('profile_id', me.id);
        if (cur && cur.id === cid) { cur = null; $('live').style.display='none'; $('blank').style.display='flex'; }
        loadChans();
      }
    });
  });
}

/* Search spans every conversation you are in, which is the thing a chat list
   alone can never answer. */
async function runSearch(q){
  var box = $('chans');
  if (!q || q.length < 2) { searching = false; loadChans(); return; }
  searching = true;
  var r = await sb.rpc('search_messages', { q: q });
  var d = r.data || [];
  box.innerHTML = d.length ? d.map(function(x){
    return '<div class="sr" data-c="'+x.channel_id+'">'+
      '<b>'+esc(x.author_name||'Someone')+' \u00b7 '+esc(x.channel_name||'Conversation')+'</b>'+
      '<span>'+esc(x.body)+'</span>'+
      '<em>'+new Date(x.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</em>'+
      '</div>';
  }).join('') : '<p style="font-size:13px;color:#5C6470;padding:14px">Nothing found.</p>';

  box.querySelectorAll('.sr').forEach(function(el){
    el.addEventListener('click', function(){ openCh(el.dataset.c); });
  });
}

/* Files exchanged in a conversation, without scrolling back through months
   of it. Images render as thumbnails so you recognise them. */
async function loadFiles(){
  if (!cur) return;
  var r = await sb.rpc('channel_files', { cid: cur.id });
  var d = r.data || [];
  $('files').innerHTML = d.length
    ? '<div class="fgrid">' + d.map(function(f){
        var isImg = /image/.test(f.type || '');
        return '<a class="fcard" href="'+esc(f.url)+'" target="_blank" rel="noopener">'+
          (isImg ? '<img src="'+esc(f.url)+'" alt="">'
                 : '<div class="doc">\u25A4</div>')+
          '<div class="meta"><b>'+esc(f.name||'File')+'</b>'+
          '<em>'+esc((f.author_name||'').split(' ')[0])+' \u00b7 '+
          new Date(f.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'})+
          '</em></div></a>';
      }).join('') + '</div>'
    : '<p style="font-size:13.5px;color:#5C6470;text-align:center;padding:40px">'+
      'Nothing shared yet. Use the paperclip to send a file.</p>';
}

function showPane(which){
  document.querySelectorAll('.pt').forEach(function(b){
    b.classList.toggle('on', b.dataset.p === which);
  });
  $('feed').style.display    = which === 'chat' ? 'flex' : 'none';
  $('typing').style.display  = which === 'chat' ? '' : 'none';
  /* Set only visibility here. Forcing display:flex made .cbox a flex item with
     no basis, which collapsed the composer to the width of its own text. */
  document.querySelector('.compose').style.display = which === 'chat' ? '' : 'none';
  $('files').style.display   = which === 'files' ? 'block' : 'none';
  if (which === 'files') loadFiles();
}

/* Installed once, at load. Works no matter how often the list repaints. */
/* The ellipsis carries the actions that need a label to be understandable —
   leaving a group, and anything added later. The four common ones stay inline. */
function openChMenu(anchor, cid){
  var mn = document.getElementById('chMenu');
  var c = chans.filter(function(x){ return x.id === cid; })[0];
  if (!c || !mn) return;
  var mine = (c.channel_members||[]).filter(function(m){ return m.profile_id === me.id; })[0] || {};

  mn.innerHTML =
    '<button data-m="pin">'    + (mine.pinned ? 'Unpin' : 'Pin to top') + '</button>' +
    '<button data-m="mute">'   + (mine.muted  ? 'Unmute' : 'Mute')      + '</button>' +
    '<button data-m="unread">Mark as unread</button>' +
    '<button data-m="copy">Copy link</button>' +
    (c.kind === 'group' ? '<button class="danger" data-m="leave">Leave group</button>' : '');
  mn.dataset.c = cid;

  var r = anchor.getBoundingClientRect();
  mn.classList.add('on');                        // measure after it is laid out
  var h = mn.offsetHeight || 180, w = mn.offsetWidth || 190;
  mn.style.top  = Math.min(r.bottom + 6, window.innerHeight - h - 12) + 'px';
  mn.style.left = Math.max(Math.min(r.left, window.innerWidth - w - 12), 10) + 'px';
}

document.addEventListener('click', async function(e){
  var mBtn = e.target.closest('[data-menu]');
  var mn = document.getElementById('chMenu');

  if (mBtn) {
    e.preventDefault(); e.stopPropagation();
    if (mn && mn.classList.contains('on') && mn.dataset.c === mBtn.dataset.menu) {
      mn.classList.remove('on');
    } else {
      openChMenu(mBtn, mBtn.dataset.menu);
    }
    return;
  }

  var mItem = e.target.closest('#chMenu [data-m]');
  if (mItem) {
    e.preventDefault(); e.stopPropagation();
    var cid = mn.dataset.c;
    var c = chans.filter(function(x){ return x.id === cid; })[0];
    var mine = c ? ((c.channel_members||[]).filter(function(m){ return m.profile_id===me.id; })[0] || {}) : {};
    mn.classList.remove('on');
    var a = mItem.dataset.m;

    if (a === 'copy') { navigator.clipboard.writeText(location.origin + '/messages?c=' + cid); return; }
    if (a === 'pin')  await sb.from('channel_members').update({ pinned: !mine.pinned }).eq('channel_id',cid).eq('profile_id',me.id);
    if (a === 'mute') await sb.from('channel_members').update({ muted: !mine.muted }).eq('channel_id',cid).eq('profile_id',me.id);
    if (a === 'unread') {
      await sb.from('channel_members')
        .update({ manually_unread:true, last_read_at:new Date(0).toISOString() })
        .eq('channel_id',cid).eq('profile_id',me.id);
      if (cur && cur.id === cid) {
        cur = null;
        document.getElementById('live').style.display='none';
        document.getElementById('blank').style.display='flex';
      }
    }
    if (a === 'leave') {
      var ok = window.vcConfirm
        ? await window.vcConfirm({ title:'Leave this group?',
            body:'You stop receiving its messages. Others keep the conversation.', confirm:'Leave' })
        : true;
      if (!ok) return;
      await sb.from('channel_members').delete().eq('channel_id',cid).eq('profile_id',me.id);
      if (cur && cur.id === cid) {
        cur = null;
        document.getElementById('live').style.display='none';
        document.getElementById('blank').style.display='flex';
      }
    }
    loadChans();
    return;
  }

  // Any other click closes it.
  if (mn) mn.classList.remove('on');

  var b = e.target.closest('[data-act]');
  if (!b) return;
  e.preventDefault();
  e.stopPropagation();

  var cid = b.dataset.c, act = b.dataset.act;
  var c = chans.filter(function(x){ return x.id === cid; })[0];
  var mine = c ? ((c.channel_members||[]).filter(function(m){ return m.profile_id === me.id; })[0] || {}) : {};

  if (act === 'copy') {
    navigator.clipboard.writeText(location.origin + '/messages?c=' + cid);
    b.classList.add('done');
    setTimeout(function(){ b.classList.remove('done'); }, 1200);
    return;
  }
  if (act === 'pin') {
    await sb.from('channel_members').update({ pinned: !mine.pinned })
      .eq('channel_id', cid).eq('profile_id', me.id);
  } else if (act === 'mute') {
    await sb.from('channel_members').update({ muted: !mine.muted })
      .eq('channel_id', cid).eq('profile_id', me.id);
  } else if (act === 'unread') {
    await sb.from('channel_members')
      .update({ manually_unread: true, last_read_at: new Date(0).toISOString() })
      .eq('channel_id', cid).eq('profile_id', me.id);
    if (cur && cur.id === cid) {
      cur = null;
      document.getElementById('live').style.display = 'none';
      document.getElementById('blank').style.display = 'flex';
    }
  }
  loadChans();
});

window.vcInit = async function(){
  sb = window.__sb; me = window.__user;

  var pq = await sb.from('profiles').select('id, full_name, email, role, avatar_url, username').eq('is_active',true);
  (pq.data||[]).forEach(function(p){ people[p.id]=p; });

  async function pres(){
    var since = new Date(Date.now()-5*60000).toISOString();
    var r = await sb.from('presence').select('profile_id').gte('last_seen_at',since);
    online = {}; (r.data||[]).forEach(function(x){ online[x.profile_id]=true; });
  }
  await pres();
  setInterval(function(){ pres().then(loadChans); }, 45000);

  // emoji picker
  $('pEmo').innerHTML = CATS.map(function(c){
    return '<div class="cat">'+c[0]+'</div><div class="grid">'+
      c[1].map(function(e){ return '<button data-e="'+e+'">'+e+'</button>'; }).join('')+'</div>';
  }).join('');

  $('emoBtn').addEventListener('click', function(e){
    e.stopPropagation();
    $('pick').dataset.target='';
    $('pick').classList.toggle('on');
  });
  document.addEventListener('click', function(){
    $('pick').classList.remove('on');
    var f = $('feed');
    if (!f) return;
    f.querySelectorAll('.qbar.open').forEach(function(x){ x.classList.remove('open'); });
    f.querySelectorAll('.react-hint.active').forEach(function(x){ x.classList.remove('active'); });
  });
  $('pick').addEventListener('click', function(e){ e.stopPropagation(); });

  $('tEmo').addEventListener('click', function(){
    $('tEmo').classList.add('on'); $('tGif').classList.remove('on');
    $('pEmo').style.display='block'; $('pGif').style.display='none';
  });
  $('tGif').addEventListener('click', function(){
    $('tGif').classList.add('on'); $('tEmo').classList.remove('on');
    $('pEmo').style.display='none'; $('pGif').style.display='block';
    if (!$('ggrid').innerHTML) loadGifs('');
  });

  $('pEmo').addEventListener('click', async function(e){
    var b = e.target.closest('button[data-e]'); if (!b) return;
    e.stopPropagation();
    var target = $('pick').dataset.target;
    if (target){
      $('pick').dataset.target=''; $('pick').classList.remove('on');
      await react(target, b.dataset.e);
      return;
    }
    $('box').value += b.dataset.e;
    $('box').focus();
  });

  /* GIFs need a free Giphy key. Without one the tab says so rather than
     showing a broken grid \u2014 and the paperclip already handles GIF files. */
  var GIPHY = window.__GIPHY_KEY || 'JXN6mwDA7OUX9lgRKGKudbF0RRFLXBHQ';
  async function loadGifs(q){
    var g = $('ggrid');
    g.innerHTML = '<p class="nogif" style="grid-column:1/-1">Loading\u2026</p>';
    try {
      // Empty query shows what is trending, which is a better opening state
      // than results for a word nobody typed.
      var url = q
        ? 'https://api.giphy.com/v1/gifs/search?api_key='+GIPHY+
          '&q='+encodeURIComponent(q)+'&limit=18&rating=pg-13&lang=en'
        : 'https://api.giphy.com/v1/gifs/trending?api_key='+GIPHY+'&limit=18&rating=pg-13';
      var res = await fetch(url);
      var d = await res.json();
      var items = (d.data||[]).map(function(x){
        var im = x.images || {};
        var small = (im.fixed_width_downsampled || im.fixed_width_small || im.fixed_width || {}).url;
        var full  = (im.fixed_width || im.original || {}).url;
        if (!small || !full) return '';
        return '<img src="'+small+'" data-u="'+full+'" alt="'+
               (x.title||'GIF').replace(/"/g,'')+'" loading="lazy">';
      }).join('');
      g.innerHTML = items || '<p class="nogif" style="grid-column:1/-1">Nothing found. Try another word.</p>';
      g.querySelectorAll('img').forEach(function(img){
        img.addEventListener('click', async function(){
          if (!cur) return;
          await sb.from('messages').insert({
            channel_id:cur.id, author_id:me.id, body:'',
            attachment_url:img.dataset.u, attachment_name:'GIF', attachment_type:'image/gif'
          });
          $('pick').classList.remove('on');
          paint(); loadChans();
        });
      });
    } catch(err){
      g.innerHTML = '<p class="nogif" style="grid-column:1/-1">Could not reach Giphy.</p>';
    }
  }
  var gt;
  $('gq').addEventListener('input', function(){
    clearTimeout(gt);
    var v = this.value.trim() || 'yes';
    gt = setTimeout(function(){ loadGifs(v); }, 400);
  });

  // people picker
  function paintPeople(){
    var opts = Object.keys(people).map(function(k){return people[k];}).filter(function(p){return p.id!==me.id;});
    if (!opts.length){
      $('people').innerHTML = '<p style="font-size:13.5px;color:#5C6470;padding:20px;text-align:center">'+
        'Nobody else has an account yet. Invite someone in People.</p>';
      return;
    }
    var ROLE = {owner:'Owner',account_owner:'Account owner',contractor:'Contractor',client:'Client'};
    $('people').innerHTML = opts.map(function(p){
      var on = picked.indexOf(p.id)>-1;
      var dot = online[p.id] ? '<i></i>' : '';
      var av = p.avatar_url
        ? '<span class="pav" style="background-image:url('+esc(p.avatar_url)+')">'+dot+'</span>'
        : '<span class="pav">'+ini(p.full_name||p.email)+dot+'</span>';
      return '<div class="pr'+(on?' sel':'')+'" data-id="'+p.id+'">'+av+
        '<span class="pb"><b>'+esc(p.full_name||p.email)+'</b>'+
        '<span>'+(ROLE[p.role]||p.role)+(online[p.id]?' \u00b7 Active now':'')+'</span></span>'+
        '<span class="tick">'+(on?'\u2713':'')+'</span></div>';
    }).join('');
    $('people').querySelectorAll('.pr').forEach(function(el){
      el.addEventListener('click', function(){
        var id=el.dataset.id, i=picked.indexOf(id);
        if (i>-1) picked.splice(i,1); else picked.push(id);
        paintPeople();
        $('gname').style.display = picked.length>1 ? 'block' : 'none';
        $('startBtn').disabled = !picked.length;
        $('startBtn').textContent = picked.length>1 ? 'Start group' : 'Start';
      });
    });
  }
  function shutModal(){ $('veil').classList.remove('on'); $('modal').classList.remove('on'); }
  $('veil').addEventListener('click', shutModal);
  $('newBtn').addEventListener('click', function(){
    picked=[]; $('gname').value=''; $('gname').style.display='none';
    $('startBtn').disabled=true; $('startBtn').textContent='Start';
    paintPeople();
    $('veil').classList.add('on'); $('modal').classList.add('on');
  });
  $('startBtn').addEventListener('click', async function(){
    if (!picked.length) return;
    var r = picked.length===1
      ? await sb.rpc('open_dm',{other:picked[0]})
      : await sb.rpc('open_group',{member_ids:picked, group_name:$('gname').value.trim()||null});
    if (r.error) return alert(r.error.message);
    shutModal(); await loadChans(); openCh(r.data);
  });

  // attachments
  $('fileBtn').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', async function(){
    var f = this.files && this.files[0];
    if (!f || !cur) return;
    if (f.size > 10*1024*1024){ alert('Files must be under 10MB.'); this.value=''; return; }
    $('send').disabled = true;
    var path = cur.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    var up = await sb.storage.from('chat').upload(path, f, { contentType: f.type });
    $('send').disabled = false; this.value='';
    if (up.error) return alert(up.error.message);
    await sb.from('messages').insert({
      channel_id:cur.id, author_id:me.id, body:$('box').value.trim(),
      attachment_url:path, attachment_name:f.name, attachment_type:f.type
    });
    $('box').value='';
    paint(); loadChans();
  });

  // compose
  $('box').addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
    if (!cur || typeTimer) return;
    sb.from('typing').upsert({channel_id:cur.id, profile_id:me.id, at:new Date().toISOString()},
      {onConflict:'channel_id,profile_id'});
    typeTimer = setTimeout(function(){ typeTimer=null; }, 2500);
  });
  /* @ pulls someone in, / points at a task or engagement. Same grammar as the
     task page, so it is one thing to learn rather than two. */
  var refs = [];
  (async function buildRefs(){
    var t = await sb.from('tasks').select('id, title').limit(40);
    (t.data||[]).forEach(function(x){
      refs.push({ slug: x.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,28),
                  label: x.title, kind:'Task', url:'/task?id='+x.id });
    });
    var e = await sb.from('engagements').select('id, title, clients(business_name)').limit(20);
    (e.data||[]).forEach(function(x){
      var nm = (x.clients && x.clients.business_name) || x.title || 'Engagement';
      refs.push({ slug: nm.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,28),
                  label: nm, kind:'Engagement', url:'/internal' });
    });
  })();

  function attachAC(ta){
    if (ta.__ac) return; ta.__ac = true;
    var ac = document.getElementById('acBox');
    var mode = null, from = -1, items = [], sel = 0;
    function close(){ ac.classList.remove('on'); mode = null; }

    function show(list, kind){
      items = list; sel = 0;
      if (!list.length) return close();
      ac.innerHTML = '<div class="ac-h">' + (kind === '@' ? 'People' : 'Reference') + '</div>' +
        list.map(function(x,i){
          return '<div class="ac-i'+(i===0?' sel':'')+'" data-i="'+i+'">'+
            (kind==='@' ? '<span class="av">'+ini(x.label)+'</span>' : '')+
            '<span><b>'+esc(x.label)+'</b>'+(x.sub?'<em>'+esc(x.sub)+'</em>':'')+'</span></div>';
        }).join('');
      var r = ta.getBoundingClientRect();
      ac.style.left = r.left + 'px';
      ac.style.top  = Math.max(r.top - 240, 10) + 'px';
      ac.classList.add('on');
      ac.querySelectorAll('.ac-i').forEach(function(el){
        el.addEventListener('mousedown', function(ev){ ev.preventDefault(); pick(Number(el.dataset.i)); });
      });
    }
    function pick(i){
      var x = items[i]; if (!x) return;
      var v = ta.value;
      ta.value = v.slice(0, from) + (mode==='@' ? '@' : '/') + x.token + ' ' + v.slice(ta.selectionStart);
      close(); ta.focus();
    }

    ta.addEventListener('input', function(){
      var pos = ta.selectionStart, v = ta.value;
      var at = Math.max(v.lastIndexOf('@', pos-1), v.lastIndexOf('/', pos-1));
      if (at < 0) return close();
      var ch = v[at], before = at === 0 ? ' ' : v[at-1];
      if (!/\s/.test(before)) return close();
      var term = v.slice(at+1, pos);
      if (/\s/.test(term)) return close();
      mode = ch; from = at;

      if (ch === '@') {
        show(Object.keys(people).map(function(k){ return people[k]; })
          .filter(function(p){
            if (p.id === me.id) return false;
            var h = (p.full_name||p.email||'').toLowerCase();
            return !term || h.indexOf(term.toLowerCase()) > -1;
          }).slice(0,6).map(function(p){
            return { label: p.full_name||p.email, sub:'@'+(p.username||''),
                     token: p.username || (p.full_name||'').split(' ')[0].toLowerCase() };
          }), '@');
      } else {
        show(refs.filter(function(r){
          return !term || r.slug.indexOf(term.toLowerCase()) > -1;
        }).slice(0,6).map(function(r){
          return { label: r.label, sub: r.kind, token: r.slug };
        }), '/');
      }
    });

    ta.addEventListener('keydown', function(e){
      if (!ac.classList.contains('on')) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sel = Math.max(0, Math.min(items.length-1, sel + (e.key==='ArrowDown'?1:-1)));
        ac.querySelectorAll('.ac-i').forEach(function(el,i){ el.classList.toggle('sel', i===sel); });
      } else if (e.key === 'Tab') { e.preventDefault(); pick(sel); }
      else if (e.key === 'Enter' && items.length) { e.preventDefault(); pick(sel); }
      else if (e.key === 'Escape') close();
    });
    ta.addEventListener('blur', function(){ setTimeout(close, 140); });
  }

  attachAC($('box'));

  async function send(){
    var t = $('box').value.trim();
    if (!t || !cur) return;
    $('box').value=''; $('box').style.height='auto';
    var parent = replyTo; clearReply();
    var r = await sb.from('messages').insert({
      channel_id:cur.id, author_id:me.id, body:t, parent_id:parent
    });
    if (r.error) return alert(r.error.message);
    await sb.from('typing').delete().eq('channel_id',cur.id).eq('profile_id',me.id);
    paint(); loadChans();
  }
  $('backBtn').addEventListener('click', function(){
    $('pane').classList.remove('open');
    $('live').style.display='none';
    $('blank').style.display='flex';
    cur = null;
    clearReply();
    loadChans();
  });

  $('send').addEventListener('click', send);
  $('box').addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  document.querySelectorAll('.tb').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.tb').forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      tab = b.dataset.t;
      loadChans();
    });
  });

  $('searchBtn').addEventListener('click', function(){
    var sBox = $('searchBox');
    var on = sBox.style.display === 'none';
    sBox.style.display = on ? 'block' : 'none';
    if (on) sBox.focus();
    else { sBox.value = ''; searching = false; loadChans(); }
  });

  var sTimer;
  $('searchBox').addEventListener('input', function(){
    clearTimeout(sTimer);
    var v = this.value.trim();
    sTimer = setTimeout(function(){ runSearch(v); }, 300);
  });

  document.querySelectorAll('.pt').forEach(function(b){
    b.addEventListener('click', function(){ showPane(b.dataset.p); });
  });

  /* Group picture. Clicking the header avatar on a group opens a file picker;
     the image belongs to the channel, so everyone in it sees the change. */
  /* openCh replaces this element, which would destroy a direct listener.
     Delegating from the header survives the swap. */
  document.querySelector('.pane-h').addEventListener('click', function(e){
    if (!e.target.closest('#hAv')) return;
    if (!cur || cur.kind !== 'group') return;
    $('grpImg').click();
  });
  $('grpImg').addEventListener('change', async function(){
    var f = this.files && this.files[0];
    if (!f || !cur) return;
    if (f.size > 3 * 1024 * 1024) { alert('Keep it under 3MB.'); this.value=''; return; }
    /* Channel-scoped path: the storage policy reads the channel id from the
       first path segment, so 'group/...' would have been unreadable. */
    var path = cur.id + '/group-' + Date.now();
    var up = await sb.storage.from('chat').upload(path, f, { contentType: f.type });
    this.value = '';
    if (up.error) { alert(up.error.message); return; }
    await sb.from('channels').update({ image_url: path }).eq('id', cur.id);
    await loadChans();
    openCh(cur.id);
  });

  await loadChans();
  var want = new URLSearchParams(location.search).get('c');
  if (want) openCh(want);
};
</script>
<!-- These must be direct children of body. Nested inside the New Message
     modal (display:none) they could never render, which is why the menu
     "did not open" — it was opening, inside a hidden parent. -->
<div class="chmenu" id="chMenu"></div>
<div class="ac" id="acBox"></div>
</body>
</html>
