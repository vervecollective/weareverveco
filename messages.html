<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Messages — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{padding:0 !important;max-width:none !important;height:100vh;display:flex;}
  .list{width:270px;border-right:1px solid #EBECEF;display:flex;flex-direction:column;background:#FCFCFD;}
  .list-h{padding:18px 18px 14px;border-bottom:1px solid #EBECEF;}
  .list-h b{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .newbtn{width:100%;margin-top:12px;padding:9px;border:1px solid #D8DAE0;border-radius:8px;
    background:#fff;font:600 13px/1 'Inter',sans-serif;cursor:pointer;color:#111827;}
  .newbtn:hover{border-color:#9A3412;color:#9A3412;}
  .chans{flex:1;overflow-y:auto;padding:8px;}
  .ch{display:flex;gap:10px;align-items:center;padding:10px;border-radius:9px;cursor:pointer;margin-bottom:2px;}
  .ch:hover{background:#F3F4F6;}
  .ch.on{background:#FDF0EB;}
  .ch .av{width:32px;height:32px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;position:relative;}
  .ch .av i{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;
    background:#00A870;border:2px solid #FCFCFD;}
  .ch .b{flex:1;min-width:0;}
  .ch .b b{font-size:13.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ch .b span{font-size:12px;color:#5C6470;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .ch .n{background:#E2445C;color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;
    min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

  .pane{flex:1;display:flex;flex-direction:column;min-width:0;}
  .pane-h{padding:15px 24px;border-bottom:1px solid #EBECEF;display:flex;align-items:center;gap:12px;
    background:#fff;}
  .pane-h .av{width:34px;height:34px;border-radius:50%;background:#111827;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
  .pane-h b{font-size:15px;font-weight:700;}
  .pane-h em{font-size:12.5px;font-style:normal;color:#00875A;font-weight:600;}
  .feed{flex:1;overflow-y:auto;padding:26px 28px;display:flex;flex-direction:column;gap:3px;
    background:#FCFCFD;}
  .feed .m:hover{background:#fff;border-radius:10px;}
  .m{padding:4px 8px !important;margin-left:-8px;}
  .day{text-align:center;font-size:11.5px;font-weight:700;color:#5C6470;margin:16px 0 10px;}
  .m{display:flex;gap:10px;padding:2px 0;}
  .m .av{width:30px;height:30px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;}
  .m .bd{flex:1;min-width:0;}
  .m .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:1px;}
  .m .hd b{font-size:13.5px;font-weight:700;}
  .m .hd em{font-size:11px;font-style:normal;color:#9CA3AF;}
  .m .tx{font-size:14.5px;color:#242830;white-space:pre-wrap;word-break:break-word;}
  .m.cont{margin-top:-2px;}
  .m.cont .av{visibility:hidden;height:0;}
  .m.cont .hd{display:none;}
  .typing{padding:6px 22px 0;font-size:12.5px;color:#5C6470;font-style:italic;height:26px;}
  .dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#9CA3AF;margin-right:2px;
    animation:bl 1.2s infinite;}
  .dots i:nth-child(2){animation-delay:.2s;} .dots i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.25;}30%{opacity:1;}}

  .compose{padding:16px 24px 22px;border-top:1px solid #EBECEF;display:flex;gap:10px;align-items:flex-end;background:#fff;}
  .compose textarea{flex:1;border:1px solid #D8DAE0;border-radius:12px;padding:12px 15px;
    font:400 14.5px/1.5 'Inter',sans-serif;resize:none;max-height:150px;color:#111827;}
  .compose textarea:focus{outline:none;border-color:#9A3412;box-shadow:0 0 0 4px rgba(154,52,18,.09);}
  .send{background:#9A3412;color:#fff;border:none;border-radius:10px;padding:12px 20px;
    font:600 14px/1 'Inter',sans-serif;cursor:pointer;}
  .send:disabled{opacity:.4;cursor:default;}
  .blank{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;}
  .blank b{display:block;font-size:16px;font-weight:700;margin-bottom:6px;}
  .blank span{font-size:14px;color:#5C6470;max-width:320px;display:block;}
  /* people picker */
  .veil{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;display:none;}
  .veil.on{display:block;}
  .modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.96);
    width:min(430px,94vw);background:#fff;border-radius:16px;z-index:90;display:none;
    box-shadow:0 24px 64px rgba(16,24,40,.28);overflow:hidden;opacity:0;
    transition:opacity .18s,transform .18s;}
  .modal.on{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  .modal-h{padding:20px 22px 16px;border-bottom:1px solid #EBECEF;}
  .modal-h b{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .modal-h p{font-size:13.5px;color:#5C6470;margin-top:3px;}
  .people{max-height:320px;overflow-y:auto;padding:8px;}
  .pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;}
  .pr:hover{background:#F6F7F9;}
  .pr.sel{background:#FDF0EB;}
  .pr .pav{width:38px;height:38px;border-radius:50%;background:#111827;color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    background-size:cover;position:relative;}
  .pr .pav i{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;
    background:#00A870;border:2px solid #fff;}
  .pr .pb{flex:1;min-width:0;}
  .pr .pb b{font-size:14.5px;font-weight:600;display:block;}
  .pr .pb span{font-size:12.5px;color:#5C6470;}
  .pr .tick{width:22px;height:22px;border-radius:50%;border:2px solid #D8DAE0;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .pr.sel .tick{background:#9A3412;border-color:#9A3412;}
  .modal-f{padding:16px 22px;border-top:1px solid #EBECEF;display:flex;gap:10px;align-items:center;}
  .modal-f input{flex:1;border:1px solid #D8DAE0;border-radius:9px;padding:10px 13px;font:400 14px/1 'Inter',sans-serif;}
  .gbtn{background:#9A3412;color:#fff;border:none;border-radius:9px;padding:11px 18px;
    font:600 14px/1 'Inter',sans-serif;cursor:pointer;}
  .gbtn:disabled{opacity:.4;cursor:default;}

  /* attachments + reactions */
  .att{margin-top:7px;border-radius:12px;overflow:hidden;max-width:340px;border:1px solid #EBECEF;}
  .att img{display:block;width:100%;height:auto;}
  .att-f{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#F6F7F9;
    font-size:13px;font-weight:600;text-decoration:none;color:#111827;}
  .qbar{position:absolute;top:-13px;right:10px;background:#fff;border:1px solid #E4E6EA;
    border-radius:999px;padding:3px 5px;display:none;gap:1px;
    box-shadow:0 4px 14px rgba(16,24,40,.14);z-index:5;}
  .m{position:relative;}
  .m:hover .qbar{display:flex;}
  .qbar button{border:none;background:none;font-size:17px;cursor:pointer;padding:3px 5px;
    border-radius:999px;line-height:1;transition:transform .1s;}
  .qbar button:hover{background:#F3F4F6;transform:scale(1.25);}
  .rx{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
  .rx button{border:1px solid #E4E6EA;background:#fff;border-radius:999px;padding:2px 9px;
    font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.6;}
  .rx button.mine{background:#FDF0EB;border-color:#9A3412;}
  .rx .add{color:#9CA3AF;font-size:13px;}
  .m:hover .rx .add{opacity:1;}
  .rx .add{opacity:0;transition:opacity .12s;}
  .tools{display:flex;gap:6px;align-items:center;}
  .tool{background:none;border:none;cursor:pointer;padding:9px;border-radius:10px;
    line-height:0;color:#5C6470;display:flex;}
  .tool svg{width:20px;height:20px;}
  .tool:hover{background:#F3F4F6;color:#111827;}
  .tool:hover{background:#F3F4F6;}
  .emo{position:absolute;bottom:78px;right:24px;background:#fff;border:1px solid #EBECEF;
    border-radius:14px;box-shadow:0 16px 44px rgba(16,24,40,.2);display:none;
    width:344px;z-index:30;overflow:hidden;}
  .emo.on{display:block;}
  .emo-tabs{display:flex;border-bottom:1px solid #EBECEF;padding:0 6px;}
  .emo-tabs button{flex:1;border:none;background:none;padding:11px 6px;cursor:pointer;
    font:600 12.5px/1 'Inter',sans-serif;color:#5C6470;border-bottom:2px solid transparent;}
  .emo-tabs button.on{color:#9A3412;border-bottom-color:#9A3412;}
  .emo-body{max-height:274px;overflow-y:auto;padding:10px;}
  .emo-cat{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    color:#9CA3AF;margin:8px 4px 6px;}
  .emo-cat:first-child{margin-top:0;}
  .emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
  .emo-grid button{border:none;background:none;font-size:21px;cursor:pointer;padding:5px;
    border-radius:8px;line-height:1.15;}
  .emo-grid button:hover{background:#F3F4F6;transform:scale(1.18);}
  .emo-grid button{transition:transform .1s;}
  .gifs{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .gifs button{border:none;background:#F3F4F6;border-radius:9px;padding:0;cursor:pointer;overflow:hidden;
    aspect-ratio:4/3;}
  .gifs img{width:100%;height:100%;object-fit:cover;display:block;}
  .gif-q{width:100%;border:1px solid #D8DAE0;border-radius:9px;padding:9px 12px;
    font:400 13.5px/1 'Inter',sans-serif;margin-bottom:9px;}

  /* quick reactions on hover */
  .qr{position:absolute;top:-14px;right:8px;background:#fff;border:1px solid #EBECEF;
    border-radius:999px;box-shadow:0 4px 14px rgba(16,24,40,.14);display:none;gap:1px;padding:3px;}
  .m{position:relative;}
  .m:hover .qr{display:flex;}
  .qr button{border:none;background:none;font-size:17px;cursor:pointer;padding:4px 5px;
    border-radius:999px;line-height:1;transition:transform .1s;}
  .qr button:hover{background:#F3F4F6;transform:scale(1.25);}
  .qr .more{font-size:14px;color:#9CA3AF;font-weight:700;}
  .compose{position:relative;}
  @media(max-width:820px){ .list{width:100%;} .pane{display:none;} .pane.open{display:flex;position:fixed;inset:0;background:#fff;z-index:60;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="list">
    <div class="list-h"><b>Messages</b>
      <button class="newbtn" id="newBtn">+ New message</button></div>
    <div class="chans" id="chans"></div>
  </div>
  <div class="pane" id="pane">
    <div class="blank" id="blank"><div><b>Pick a conversation</b>
      <span>Direct messages for anything that is not about a specific task. Task discussion belongs on the task.</span></div></div>
    <div id="live" style="display:none;flex:1;flex-direction:column;min-height:0">
      <div class="pane-h"><span class="av" id="hAv"></span><b id="hName"></b><em id="hOn"></em></div>
      <div class="feed" id="feed"></div>
      <div class="typing" id="typing"></div>
      <div class="compose">
        <div class="emo" id="emo">
          <div class="emo-tabs">
            <button class="on" data-tab="emoji">Emoji</button>
            <button data-tab="gif">GIFs</button>
          </div>
          <div class="emo-body" id="emoBody"></div>
        </div>
        <div class="tools">
          <button class="tool" id="emoBtn" title="Emoji" aria-label="Emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>
              <circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg>
          </button>
          <button class="tool" id="fileBtn" title="Attach a file" aria-label="Attach a file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.4 11.05 12.25 20.2a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.67 3.67 0 0 1 5.19 5.19l-9.2 9.19a1.83 1.83 0 0 1-2.59-2.59l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file" style="display:none"
            accept="image/*,video/*,application/pdf,.doc,.docx">
        </div>
        <textarea id="box" rows="1" placeholder="Write a message"></textarea>
        <button class="send" id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="modal" id="modal">
  <div class="modal-h"><b>New message</b>
    <p>Pick one person for a direct message, or several for a group.</p></div>
  <div class="people" id="people"></div>
  <div class="modal-f">
    <input type="text" id="gname" placeholder="Group name (optional)" style="display:none">
    <button class="gbtn" id="startBtn" disabled>Start</button>
  </div>
</div>

<script>
function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function ini(n){return (n||'?').split(' ').map(function(p){return p[0];}).filter(Boolean).join('').slice(0,2).toUpperCase();}
var sb, me, chans=[], people={}, cur=null, online={}, sub=null, typeTimer=null;

function when(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function dayLabel(ts){
  var d=new Date(ts), n=new Date();
  if (d.toDateString()===n.toDateString()) return 'Today';
  var y=new Date(n); y.setDate(y.getDate()-1);
  if (d.toDateString()===y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function other(c){
  var ids=(c.channel_members||[]).map(function(m){return m.profile_id;}).filter(function(x){return x!==me.id;});
  return people[ids[0]] || null;
}
function title(c){
  if (c.name) return c.name;
  var o = other(c);
  return o ? (o.full_name || o.email) : 'Conversation';
}

async function loadChans(){
  var r = await sb.from('channels')
    .select('*, channel_members(profile_id, last_read_at), messages(body, created_at, author_id)')
    .order('last_message_at',{ascending:false});
  chans = (r.data||[]).filter(function(c){
    return (c.channel_members||[]).some(function(m){ return m.profile_id === me.id; });
  });

  $('chans').innerHTML = chans.length ? chans.map(function(c){
    var last = (c.messages||[]).sort(function(a,b){return a.created_at<b.created_at?1:-1;})[0];
    var mine = (c.channel_members||[]).filter(function(m){return m.profile_id===me.id;})[0];
    var unread = (c.messages||[]).filter(function(m){
      return m.author_id!==me.id && mine && new Date(m.created_at) > new Date(mine.last_read_at||0);
    }).length;
    var o = other(c);
    var isOn = o && online[o.id];
    return '<div class="ch'+(cur&&cur.id===c.id?' on':'')+'" data-id="'+c.id+'">'+
      '<span class="av">'+ini(title(c))+(isOn?'<i></i>':'')+'</span>'+
      '<span class="b"><b>'+esc(title(c))+'</b>'+
      '<span>'+esc(last ? last.body.slice(0,44) : 'No messages yet')+'</span></span>'+
      (unread?'<span class="n">'+unread+'</span>':'')+'</div>';
  }).join('') : '<p style="font-size:13px;color:#5C6470;padding:14px">No conversations yet.</p>';

  $('chans').querySelectorAll('.ch').forEach(function(el){
    el.addEventListener('click', function(){ openCh(el.dataset.id); });
  });
}

async function openCh(id){
  cur = chans.filter(function(c){return c.id===id;})[0];
  if (!cur) return;
  $('blank').style.display='none';
  $('live').style.display='flex';
  $('pane').classList.add('open');

  var o = other(cur);
  $('hAv').textContent = ini(title(cur));
  $('hName').textContent = title(cur);
  $('hOn').textContent = (o && online[o.id]) ? 'Active now' : '';

  await paint();
  await sb.from('channel_members').update({ last_read_at:new Date().toISOString() })
    .eq('channel_id', id).eq('profile_id', me.id);
  loadChans();

  if (sub) sb.removeChannel(sub);
  sub = sb.channel('msg-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'channel_id=eq.'+id}, paint)
    .on('postgres_changes',{event:'*',schema:'public',table:'typing',filter:'channel_id=eq.'+id}, showTyping)
    .subscribe();
}

var rxMap = {};

async function paint(){
  if (!cur) return;
  var r = await sb.from('messages').select('*').eq('channel_id',cur.id).order('created_at').limit(200);
  var ms = r.data||[];

  rxMap = {};
  if (ms.length) {
    var rr = await sb.from('reactions').select('*')
      .in('message_id', ms.map(function(m){ return m.id; }));
    (rr.data||[]).forEach(function(x){
      rxMap[x.message_id] = rxMap[x.message_id] || {};
      var e = rxMap[x.message_id][x.emoji] = rxMap[x.message_id][x.emoji] || { n:0, mine:false };
      e.n++; if (x.profile_id === me.id) e.mine = true;
    });
  }
  var html='', lastDay='', lastAuthor='', lastAt=0;
  ms.forEach(function(m){
    var d = dayLabel(m.created_at);
    if (d!==lastDay){ html+='<div class="day">'+d+'</div>'; lastDay=d; lastAuthor=''; }
    var p = people[m.author_id]||{};
    var nm = p.full_name||p.email||'Someone';
    // Group consecutive messages from the same person within 5 minutes.
    var cont = m.author_id===lastAuthor && (new Date(m.created_at)-lastAt) < 300000;
    var att = '';
    if (m.attachment_url) {
      var isImg = (m.attachment_type||'').indexOf('image') === 0;
      att = isImg
        ? '<div class="att"><a href="'+esc(m.attachment_url)+'" target="_blank" rel="noopener">'+
          '<img src="'+esc(m.attachment_url)+'" alt="'+esc(m.attachment_name||'')+'"></a></div>'
        : '<div class="att"><a class="att-f" href="'+esc(m.attachment_url)+'" target="_blank" rel="noopener">'+
          '\uD83D\uDCC4 '+esc(m.attachment_name||'File')+'</a></div>';
    }
    var rx = (rxMap[m.id] || {});
    var quick = '<div class="qr">' + QUICK.map(function(e){
      return '<button data-qm="'+m.id+'" data-e="'+e+'">'+e+'</button>';
    }).join('') + '<button class="more" data-qm="'+m.id+'" data-e="more">+</button></div>';

    var rxHtml = '<div class="rx">' + Object.keys(rx).map(function(e){
      return '<button class="'+(rx[e].mine?'mine':'')+'" data-m="'+m.id+'" data-e="'+e+'">'+
        e+' '+rx[e].n+'</button>';
    }).join('') + '<button class="add" data-m="'+m.id+'" data-e="add">+</button></div>';

    var qb = '<span class="qbar">' + QUICK.map(function(q){
      return '<button data-m="'+m.id+'" data-e="'+q+'">'+q+'</button>';
    }).join('') + '<button data-m="'+m.id+'" data-e="add">+</button></span>';

    html += '<div class="m'+(cont?' cont':'')+'">'+ qb +
      '<span class="av">'+ini(nm)+'</span><span class="bd">'+
      '<span class="hd"><b>'+esc(nm)+'</b><em>'+when(m.created_at)+'</em></span>'+
      '<div class="tx">'+esc(m.body)+'</div>'+att+rxHtml+'</span>'+quick+'</div>';
    lastAuthor=m.author_id; lastAt=new Date(m.created_at);
  });
  $('feed').innerHTML = html || '<div style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px">'+
   '<div><div style="font-size:15px;font-weight:600;color:#111827;margin-bottom:5px">No messages yet</div>'+
   '<div style="font-size:13.5px;color:#5C6470;max-width:280px">Say hello. Files, emoji and reactions all work here.</div></div></div>';
  $('feed').scrollTop = $('feed').scrollHeight;

  $('feed').querySelectorAll('.qr button').forEach(function(b){
    b.addEventListener('click', async function(ev){
      ev.stopPropagation();
      var mid = b.dataset.qm, e = b.dataset.e;
      if (e === 'more') {
        var box = $('emo');
        $('emo').querySelectorAll('.emo-tabs button').forEach(function(x){ x.classList.remove('on'); });
        $('emo').querySelector('[data-tab=emoji]').classList.add('on');
        paintEmoji();

            channel_id: cur.id, author_id: me.id,
            body: $('box').value.trim() || 'GIF',
            attachment_url: b.dataset.gif, attachment_name: 'GIF', attachment_type: 'image/gif'
          });
          $('box').value = '';
          paint(); loadChans();
        });
      });
    } catch (err) {
      $('gifGrid').innerHTML = '<p style="grid-column:1/-1;font-size:12.5px;color:#9CA3AF;padding:8px">GIFs are unavailable right now.</p>';
    }
  }

  paintEmoji();
  $('emo').querySelectorAll('.emo-tabs button').forEach(function(t){
    t.addEventListener('click', function(e){
      e.stopPropagation();
      $('emo').querySelectorAll('.emo-tabs button').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      if (t.dataset.tab === 'gif') paintGifs(''); else paintEmoji();
    });
  });
  $('emoBtn').addEventListener('click', function(e){
    e.stopPropagation();
    $('emo').dataset.target = '';
    $('emo').style.top = 'auto'; $('emo').style.bottom = '74px';
    $('emo').classList.toggle('on');
  });
  document.addEventListener('click', function(){ $('emo').classList.remove('on'); });
  $('emo').addEventListener('click', async function(e){
    var b = e.target.closest('.emo-grid button'); if (!b) return;
    e.stopPropagation();
    var target = $('emo').dataset.target;
    if (target) {
      $('emo').dataset.target = '';
      $('emo').classList.remove('on');
      await react(target, b.dataset.e);
      return;
    }
    if (false) {
      await sb.from('reactions')
        .insert({ message_id: target, profile_id: me.id, emoji: b.dataset.e })
        .then(function(){}, function(){});
      $('emo').dataset.target = '';
      $('emo').classList.remove('on');
      $('emo').style.top = 'auto'; $('emo').style.bottom = '74px';
      paint();
      return;
    }
    $('box').value += b.dataset.e;
    $('box').focus();
  });

  /* attachments */
  $('fileBtn').addEventListener('click', function(){ $('file').click(); });
  $('file').addEventListener('change', async function(){
    var f = this.files && this.files[0];
    if (!f || !cur) return;
    if (f.size > 10*1024*1024) { alert('Files must be under 10MB.'); this.value=''; return; }
    $('send').disabled = true; $('box').placeholder = 'Uploading\u2026';
    var path = cur.id + '/' + Date.now() + '-' + f.name.replace(/[^\w.\-]/g,'_');
    var up = await sb.storage.from('chat').upload(path, f, { contentType: f.type });
    $('send').disabled = false; $('box').placeholder = 'Write a message';
    this.value = '';
    if (up.error) return alert(up.error.message);
    var url = sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
    await sb.from('messages').insert({
      channel_id: cur.id, author_id: me.id,
      body: $('box').value.trim() || f.name,
      attachment_url: url, attachment_name: f.name, attachment_type: f.type
    });
    $('box').value = '';
    paint(); loadChans();
  });

  $('box').addEventListener('input', function(){
    this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,150)+'px';
    if (!cur || typeTimer) return;
    sb.from('typing').upsert({ channel_id:cur.id, profile_id:me.id, at:new Date().toISOString() },
      { onConflict:'channel_id,profile_id' });
    typeTimer = setTimeout(function(){ typeTimer=null; }, 2500);
  });

  async function send(){
    var t = $('box').value.trim();
    if (!t || !cur) return;
    $('box').value=''; $('box').style.height='auto';
    var r = await sb.from('messages').insert({ channel_id:cur.id, author_id:me.id, body:t });
    if (r.error) return alert(r.error.message);
    await sb.from('typing').delete().eq('channel_id',cur.id).eq('profile_id',me.id);
    paint(); loadChans();
  }
  $('send').addEventListener('click', send);
  $('box').addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });
};
</script>
</body>
</html>
