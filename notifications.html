<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Notifications — Verve Collective</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/shell.css">
<script type="module" src="/assets/shell.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:#111827;line-height:1.55;
    -webkit-font-smoothing:antialiased;background:#F6F7F9;}
  .wrap{max-width:820px;margin:0;padding:30px 34px 90px;}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;}
  .lede{color:#5C6470;font-size:15px;margin-bottom:22px;}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
  .chip{padding:8px 15px;border:1px solid #D8DAE0;border-radius:999px;background:#fff;
    font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;color:#374151;}
  .chip.on{background:#9A3412;border-color:#9A3412;color:#fff;font-weight:600;}
  .chip:hover{border-color:#9A3412;}
  .readall{margin-left:auto;background:none;border:none;font:600 13px/1 'Inter',sans-serif;
    color:#5C6470;cursor:pointer;}
  .readall:hover{color:#9A3412;}
  .day{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    color:#9CA3AF;margin:22px 0 9px;}
  .n{display:flex;gap:13px;background:#fff;border:1px solid #EBECEF;border-radius:11px;
    padding:15px 16px;margin-bottom:7px;text-decoration:none;color:inherit;
    transition:box-shadow .14s,transform .14s;}
  .n:hover{box-shadow:0 3px 12px rgba(16,24,40,.09);transform:translateY(-1px);}
  .n.read{opacity:.6;background:#FBFBFC;}
  .n.read:hover{opacity:1;}
  .dot{width:8px;height:8px;border-radius:50%;background:#9A3412;margin-top:7px;flex-shrink:0;}
  .n.read .dot{background:#D8DAE0;}
  .n.urgent{border-left:3px solid #B91C1C;}
  .b{flex:1;min-width:0;}
  .b b{font-size:14px;font-weight:600;display:block;line-height:1.4;}
  .n.read .b b{font-weight:500;color:#4B5563;}
  .b em{font-size:13px;font-style:normal;color:#5C6470;display:block;margin-top:2px;line-height:1.55;}
  .when{font-size:11.5px;color:#9CA3AF;white-space:nowrap;flex-shrink:0;}
  .empty{background:#fff;border:1px solid #EBECEF;border-radius:12px;padding:56px 24px;
    text-align:center;}
  .empty b{display:block;font-size:16px;font-weight:700;margin-bottom:6px;}
  .empty span{font-size:14px;color:#5C6470;}
  .more{width:100%;margin-top:14px;background:#fff;border:1px solid #D8DAE0;border-radius:10px;
    padding:12px;font:600 13.5px/1 'Inter',sans-serif;color:#374151;cursor:pointer;}
  .more:hover{border-color:#9A3412;color:#9A3412;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Notifications</h1>
  <p class="lede">Everything the system has told you, newest first.</p>
  <div class="bar" id="bar"></div>
  <div id="list"></div>
  <button class="more" id="more" style="display:none">Load older</button>
</div>

<script>
function $(i){return document.getElementById(i);}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
var sb, me, all = [], filt = 'unread', page = 0, PER = 40;

var GROUPS = [
  ['unread','Unread', function(n){ return !n.read_at; }],
  ['all','Everything', function(){ return true; }],
  ['slip','Behind', function(n){ return /^slip_|client_risk/.test(n.kind); }],
  ['people','Mentions and replies', function(n){ return /mention|reply|message/.test(n.kind); }],
  ['work','Work', function(n){ return /assigned|offer|handover/.test(n.kind); }],
  ['money','Money', function(n){ return /payout|payment/.test(n.kind); }]
];

function dayLabel(ts){
  var d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return 'Today';
  var y = new Date(n); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
}
function ago(ts){
  var m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  if (m < 1440) return Math.round(m/60) + 'h';
  return Math.round(m/1440) + 'd';
}

function render(){
  var g = GROUPS.filter(function(x){ return x[0] === filt; })[0];
  var shown = all.filter(g[2]);

  $('bar').innerHTML = GROUPS.map(function(x){
    var n = all.filter(x[2]).length;
    if (x[0] !== 'unread' && x[0] !== 'all' && !n) return '';
    return '<button class="chip'+(filt===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+
      (n ? ' <span style="opacity:.65">'+n+'</span>' : '')+'</button>';
  }).join('') + '<button class="readall" id="readall">Mark all read</button>';

  $('bar').querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){ filt = b.dataset.f; render(); });
  });
  $('readall').addEventListener('click', async function(){
    all.forEach(function(n){ n.read_at = n.read_at || new Date().toISOString(); });
    render();
    await sb.from('notifications').update({ read_at:new Date().toISOString() })
      .eq('profile_id', me.id).is('read_at', null);
  });

  if (!shown.length) {
    $('list').innerHTML = '<div class="empty"><b>'+
      (filt==='unread' ? 'You are all caught up' : 'Nothing here')+'</b>'+
      '<span>'+(filt==='unread'
        ? 'Anything new will appear here and as a pop-up.'
        : 'Nothing has come through in this category yet.')+'</span></div>';
    return;
  }

  var html = '', lastDay = '';
  shown.forEach(function(n){
    var d = dayLabel(n.created_at);
    if (d !== lastDay) { html += '<div class="day">'+d+'</div>'; lastDay = d; }
    var urgent = /slip_badly_late|client_risk|slip_blocked/.test(n.kind);
    html += '<a class="n'+(n.read_at?' read':'')+(urgent?' urgent':'')+'" '+
      'href="'+esc(n.url||'#')+'" data-id="'+n.id+'">'+
      '<span class="dot"></span><span class="b"><b>'+esc(n.title)+'</b>'+
      (n.body ? '<em>'+esc(n.body)+'</em>' : '')+'</span>'+
      '<span class="when">'+ago(n.created_at)+'</span></a>';
  });
  $('list').innerHTML = html;

  $('list').querySelectorAll('.n').forEach(function(a){
    a.addEventListener('click', async function(e){
      e.preventDefault();
      var href = a.getAttribute('href');
      var it = all.filter(function(x){ return x.id === a.dataset.id; })[0];
      if (it) it.read_at = new Date().toISOString();
      a.classList.add('read');
      try {
        await sb.from('notifications').update({ read_at:new Date().toISOString() }).eq('id', a.dataset.id);
      } catch (err) {}
      if (href && href !== '#') location.href = href;
      else render();
    });
  });
}

async function load(){
  var r = await sb.from('notifications').select('*')
    .eq('profile_id', me.id)
    .order('created_at', { ascending:false })
    .range(page * PER, page * PER + PER - 1);
  all = all.concat(r.data || []);
  $('more').style.display = (r.data || []).length === PER ? 'block' : 'none';
  render();
}

window.vcInit = async function(){
  sb = window.__sb; me = window.__user;
  $('more').addEventListener('click', function(){ page++; load(); });
  load();
};
</script>
</body>
</html>
